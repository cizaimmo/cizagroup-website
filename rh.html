<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ressources Humaines — CIZA GROUP</title>
<link rel="icon" href="logotransparent.png">

<style>
/* GLOBAL */
body{
    margin:0;
    background:#06142e;
    color:white;
    font-family: Arial, sans-serif;
}
a{text-decoration:none;color:#F2B840;}

/* HEADER */
header{
    position:fixed;top:0;left:0;width:100%;
    background:#06142eDD;backdrop-filter:blur(6px);
    padding:15px 22px;z-index:999;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid #0e2a50;
}
header img{height:55px;}
.nav-links{display:flex;gap:22px;font-size:15px;}
.nav-links a{color:white;opacity:.8;}
.nav-links a:hover{opacity:1;color:#F2B840;}
.lang-switch span{
    margin-left:10px;cursor:pointer;opacity:.6;font-weight:bold;
}
.lang-switch .active{opacity:1;color:#F2B840;}

/* HERO */
.hero{
    padding:150px 20px 70px;
    text-align:center;
}
.hero h1{
    font-size:32px;
    color:#F2B840;
    margin-bottom:10px;
}
.hero p{opacity:.8;font-size:16px;}

/* WRAPPER */
.wrapper{
    max-width:950px;
    margin:auto;
    padding:20px;
}

/* SECTION BOX */
.section{
    background:#0b1c34dd;
    padding:30px;
    border-radius:16px;
    border:1px solid #12335c;
    margin-bottom:40px;
}
.section h2{
    color:#F2B840;
    margin-top:0;
    text-align:center;
    font-size:26px;
}
.section p{opacity:.85;}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}
.card{
    background:#0f223d;
    padding:18px;
    border-radius:14px;
    border:1px solid #1d3b63;
    transition:.3s;
}
.card:hover{
    transform:translateY(-4px);
    border-color:#F2B840;
}
.card h3{color:#F2B840;margin:0 0 10px;}
.card p{opacity:.85;font-size:14px;}

/* FORMULAIRE */
.form-box{
    background:#0b1c34cc;
    padding:25px;
    border-radius:16px;
    border:1px solid #12335c;
}
.form-box h2{color:#F2B840;margin-top:0;text-align:center;}

input, select, textarea{
    width:100%;padding:14px;border-radius:10px;
    border:none;margin:8px 0;background:#112544;color:white;
}
textarea{height:140px;resize:none;}
button{
    width:100%;padding:14px;border:none;border-radius:10px;
    background:#F2B840;color:#06142e;font-size:16px;
    font-weight:bold;cursor:pointer;margin-top:14px;
}
button:hover{background:#c99933;}

/* FOOTER */
footer{
    margin-top:40px;padding:25px;text-align:center;
    background:#020a16;font-size:13px;opacity:.75;
}

/* MOBILE */
@media(max-width:600px){
    header img{height:45px;}
    .hero h1{font-size:26px;}
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <img src="logotransparent.png">

    <div class="nav-links">
        <a href="index.html" data-fr="Accueil" data-en="Home" data-ki="Ahabanza"></a>
        <a href="apropos.html" data-fr="À propos" data-en="About" data-ki="Abo turi bo"></a>
        <a href="business-diaspora.html" data-fr="Diaspora" data-en="Diaspora" data-ki="Abadiaspora"></a>
        <a href="services-burundi.html" data-fr="Services" data-en="Services" data-ki="Serivisi"></a>
        <a href="contact.html" data-fr="Contact" data-en="Contact" data-ki="Tuvugishe"></a>
    </div>

    <div class="lang-switch">
        <span onclick="setLang('fr')" id="lg-fr">FR</span>
        <span onclick="setLang('en')" id="lg-en">EN</span>
        <span onclick="setLang('ki')" id="lg-ki">KI</span>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <h1 data-fr="Ressources Humaines"
        data-en="Human Resources"
        data-ki="Abakozi & Abarongoye"></h1>

    <p data-fr="Recrutement, carrières, partenariats RH."
       data-en="Recruitment, careers, HR partnerships."
       data-ki="Gutorwa, imirimo, ubufatanye mu bijanye n’abakozi."></p>
</section>

<div class="wrapper">

    <!-- SECTION: POURQUOI NOUS REJOINDRE -->
    <div class="section">
        <h2 data-fr="Pourquoi rejoindre CIZA GROUP ?"
            data-en="Why join CIZA GROUP?"
            data-ki="Kubera iki wosanga CIZA GROUP?"></h2>

        <p data-fr="Nous construisons une équipe solide, innovante et engagée pour transformer les services au Burundi et à l’international."
           data-en="We are building a strong, innovative and committed team to transform services in Burundi and internationally."
           data-ki="Dukora umugwi ukomeye, ushoboye kandi w’ubunyabwenge kugira duhindure serivisi mu Burundi no hanze."></p>

        <ul style="opacity:.9;line-height:1.8;">
            <li data-fr="Vision à long terme & croissance interne"
                data-en="Long-term vision & internal growth"
                data-ki="Indyane ndende n’iterambere ry’imbere mu kigo"></li>

            <li data-fr="Environnement professionnel & structuré"
                data-en="Professional & structured environment"
                data-ki="Ahaboneye hakorana kinyamwuga"></li>

            <li data-fr="Développement de compétences & formations"
                data-en="Skills development & training"
                data-ki="Amahugurwa n’iterambere ry’ubumenyi"></li>

            <li data-fr="Impact réel dans le pays & diaspora"
                data-en="Real impact in the country & diaspora"
                data-ki="Ingorane nziza ku gihugu n’abadiaspora"></li>
        </ul>
    </div>

    <!-- SECTION: OFFRES -->
    <div class="section">
        <h2 data-fr="Offres & Opportunités"
            data-en="Opportunities & Careers"
            data-ki="Ibiranga akazi n’amahirwe"></h2>

        <div class="cards">

            <div class="card">
                <h3 data-fr="Candidature spontanée"
                    data-en="Open Application"
                    data-ki="Gusaba akazi ukoresheje ubwishatse"></h3>
                <p data-fr="Postulez à tout moment, même sans offre disponible."
                   data-en="Apply anytime, even without an open position."
                   data-ki="Urashobora gusaba akazi igihe cose naho ata kibanza kiri kumurongo."></p>
            </div>

            <div class="card">
                <h3 data-fr="Postes — Burundi"
                    data-en="Positions — Burundi"
                    data-ki="Akamirimo — Burundi"></h3>
                <p data-fr="Offres locales pour nos filiales & services."
                   data-en="Local positions for our branches & services."
                   data-ki="Ibiraka vy’imbere mu gihugu."></p>
            </div>

            <div class="card">
                <h3 data-fr="Postes — International"
                    data-en="International Positions"
                    data-ki="Akamirimo — Mpuzamakungu"></h3>
                <p data-fr="Opportunités à l’étranger selon les besoins."
                   data-en="International opportunities depending on needs."
                   data-ki="Amahigwe yo gukora hanze y’igihugu."></p>
            </div>

        </div>
    </div>

    <!-- FORMULAIRE RH -->
    <div class="form-box">
        <h2 data-fr="Formulaire RH"
            data-en="HR Form"
            data-ki="Ifishi y’abakozi"></h2>

        <form action="https://formsubmit.co/rh@cizagroup.com" method="POST">

            <input type="text" name="name" placeholder="Nom complet / Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Téléphone / Phone Number">

            <input type="text" name="country" placeholder="Pays / Country">

            <select name="type" required>
                <option value="">Type de demande</option>
                <option>Candidature spontanée</option>
                <option>Stage</option>
                <option>Recrutement entreprise</option>
                <option>Collaboration RH</option>
            </select>

            <textarea name="message" placeholder="Votre message..." required></textarea>

            <button type="submit"
                    data-fr="Envoyer la demande"
                    data-en="Send Request"
                    data-ki="Rungika"></button>
        </form>

        <p style="margin-top:15px;opacity:.7;font-size:13px;">
            📎 Pour envoyer votre CV, veuillez l’envoyer à :  
            <a href="mailto:rh@cizagroup.com">rh@cizagroup.com</a>
        </p>
    </div>

    <!-- CONTACT DIRECT RH -->
    <div class="section">
        <h2 data-fr="Contacts RH"
            data-en="HR Contacts"
            data-ki="Uburyo bwo kuvugana n’abakozi"></h2>

        <p data-fr="Contact direct pour les dossiers urgents ou les recrutements."
           data-en="Direct contact for urgent cases or recruitments."
           data-ki="Uburyo bwo gutanga ibisabwa vyihuta."></p>

        <p>📧 rh@cizagroup.com</p>
        <p>📧 infos@cizagroup.com</p>
        <p>📍 Bujumbura, Burundi</p>
    </div>

</div>

<footer>
    © 2026 CIZA GROUP — Tous droits réservés.
</footer>

<script>
function setLang(l){
    document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = el.dataset[l];
    });
    document.querySelectorAll(".lang-switch span").forEach(el=>el.classList.remove("active"));
    document.getElementById("lg-"+l).classList.add("active");
}
setLang("fr");
</script>

</body>
</html>
