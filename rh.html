<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ressources Humaines — CIZA GROUP</title>
<link rel="icon" href="logotransparent.png">

<style>
/* GLOBAL */
body{
    margin:0;
    background:#06142e;
    color:white;
    font-family: Arial, sans-serif;
}
a{text-decoration:none;color:#F2B840;}

/* HEADER */
header{
    position:fixed;top:0;left:0;width:100%;
    background:#06142eDD;backdrop-filter:blur(6px);
    padding:15px 22px;z-index:999;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid #0e2a50;
}
header img{height:55px;}

.nav-links{
    display:flex;
    gap:22px;
    font-size:15px;
}
.nav-links a{color:white;opacity:.8;}
.nav-links a:hover{opacity:1;color:#F2B840;}

.lang-switch span{
    margin-left:10px;
    cursor:pointer;
    opacity:.6;
    font-weight:bold;
}
.lang-switch .active{
    opacity:1;
    color:#F2B840;
}

/* HERO */
.hero{
    padding:150px 20px 70px;
    text-align:center;
}
.hero h1{
    font-size:34px;
    color:#F2B840;
    margin-bottom:10px;
}
.hero p{
    opacity:.8;
    font-size:16px;
}

/* CONTENT WRAPPER */
.wrapper{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* FORMULAIRE RH */
.form-box{
    background:#0b1c34cc;
    padding:25px;
    border-radius:16px;
    border:1px solid #12335c;
    margin-bottom:40px;
}
.form-box h2{
    text-align:center;
    margin-top:0;
    color:#F2B840;
}

input, select, textarea{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    margin:8px 0;
    background:#112544;
    color:white;
}
textarea{
    height:130px;
    resize:none;
}
input[type="file"]{
    background:none;
    padding:5px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#F2B840;
    color:#06142e;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:14px;
}
button:hover{background:#c99933;}

/* BLOCKS */
.block{
    background:#0b1c34cc;
    padding:25px;
    border-radius:16px;
    border:1px solid #12335c;
    margin-bottom:35px;
}
.block h2{
    margin-top:0;
    color:#F2B840;
}
.block p{opacity:.85;line-height:1.6;}

/* FOOTER */
footer{
    margin-top:40px;
    padding:25px;
    text-align:center;
    background:#020a16;
    opacity:.75;
    font-size:13px;
}

/* MOBILE */
@media(max-width:600px){
    header img{height:46px;}
    .hero h1{font-size:28px;}
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <img src="logotransparent.png">

    <div class="nav-links">
        <a href="index.html" data-fr="Accueil" data-en="Home" data-ki="Ahabanza"></a>
        <a href="apropos.html" data-fr="À propos" data-en="About" data-ki="Abo turi bo"></a>
        <a href="business-diaspora.html" data-fr="Diaspora" data-en="Diaspora" data-ki="Abadiaspora"></a>
        <a href="services-burundi.html" data-fr="Services" data-en="Services" data-ki="Serivisi"></a>
        <a href="contact.html" data-fr="Contact" data-en="Contact" data-ki="Tuvugishe"></a>
    </div>

    <div class="lang-switch">
        <span onclick="setLang('fr')" id="lg-fr">FR</span>
        <span onclick="setLang('en')" id="lg-en">EN</span>
        <span onclick="setLang('ki')" id="lg-ki">KI</span>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <h1 data-fr="Ressources Humaines"
        data-en="Human Resources"
        data-ki="Abakozi & Ibikenewe"></h1>

    <p data-fr="Rejoignez une entreprise moderne, ambitieuse et tournée vers l’avenir."
       data-en="Join a modern, ambitious and forward-looking company."
       data-ki="Injira ishirahamwe rigezweho kandi riteye imbere."></p>
</section>

<div class="wrapper">

    <!-- FORMULAIRE CANDIDATURE -->
    <div class="form-box">
        <h2 data-fr="Postuler maintenant"
            data-en="Apply Now"
            data-ki="Saba akazi"></h2>

        <form action="https://formsubmit.co/rh@cizagroup.com" method="POST" enctype="multipart/form-data">

            <!-- copie vers infos@ -->
            <input type="hidden" name="_cc" value="infos@cizagroup.com">

            <input type="text" name="name" placeholder="Nom complet / Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Téléphone / Phone Number">

            <select name="poste" required>
                <option value="">Sélectionnez un poste</option>
                <option>Chauffeur — CizaRide+</option>
                <option>Livreur — CizaDelivery</option>
                <option>Développeur / IT — CizaTech</option>
                <option>Assistant administratif — CizaAssist</option>
                <option>Agent logistique — CizaLogistics</option>
                <option>Commercial / Vente</option>
                <option>Marketing & Communication</option>
                <option>Immobilier — CizaImmo</option>
            </select>

            <label style="opacity:.8;">CV (PDF ou DOCX) :</label>
            <input type="file" name="cv" accept=".pdf,.doc,.docx" required>

            <textarea name="message" placeholder="Votre message ou motivation..." required></textarea>

            <button type="submit"
                data-fr="Envoyer ma candidature"
                data-en="Send Application"
                data-ki="Rungika ivyasabwe"></button>
        </form>
    </div>

    <!-- BLOCK 1 : POURQUOI NOUS REJOINDRE -->
    <div class="block">
        <h2 data-fr="Pourquoi rejoindre CIZA GROUP"
            data-en="Why Join CIZA GROUP"
            data-ki="Impamvu wotugira"></h2>

        <p data-fr="CIZA GROUP construit l’un des plus grands écosystèmes multiservices du Burundi : mobilité, technologie, immobilier, conciergerie, logistique. Nous cherchons des talents fiables, motivés et ambitieux."
           data-en="CIZA GROUP is building one of Burundi’s largest multiservice ecosystems: mobility, technology, real estate, concierge, logistics. We seek reliable and ambitious talents."
           data-ki="CIZA GROUP yubaka uburyo bunini bwa serivisi zitandukanye mu Burundi. Dukeneye abantu b'inyangamugayo kandi b’abitanga."></p>
    </div>

    <!-- BLOCK 2 : PROCESSUS -->
    <div class="block">
        <h2 data-fr="Processus de recrutement"
            data-en="Recruitment Process"
            data-ki="Uburyo bwo guhitamwo abakozi"></h2>

        <p data-fr="1) Envoi de candidature <br>2) Analyse du dossier <br>3) Entretien (physique ou en ligne) <br>4) Test pratique selon le poste <br>5) Validation finale & intégration."
           data-en="1) Send application <br>2) File review <br>3) Interview (online or in person) <br>4) Job-related test <br>5) Final approval & onboarding."
           data-ki="1) Kurungika ibisabwa <br>2) Isuzuma <br>3) Ikiganiro <br>4) Ikizamini c'umwuga <br>5) Kwemezwa."></p>
    </div>

    <!-- BLOCK 3 : DOCUMENTS -->
    <div class="block">
        <h2 data-fr="Documents requis"
            data-en="Required Documents"
            data-ki="Ibipapuro bikenewe"></h2>

        <p data-fr="• CV à jour <br>• Copie pièce d’identité <br>• Lettre de motivation (optionnel) <br>• Permis de conduire (pour CizaRide+)"
           data-en="• Updated CV <br>• ID copy <br>• Motivation letter (optional) <br>• Driving license (for CizaRide+)"
           data-ki="• CV <br>• Ikarata y’indangamuntu <br>• Ibaruwa isaba akazi (ku bushake)"></p>
    </div>

    <!-- BLOCK 4 : CONTACT DIRECT -->
    <div class="block">
        <h2 data-fr="Contact direct"
            data-en="Direct Contact"
            data-ki="Tuvugishe"></h2>

        <p>
            📧 rh@cizagroup.com — Ressources Humaines<br>
            📧 infos@cizagroup.com — Général<br><br>
            📍 Bujumbura, Burundi
        </p>
    </div>

</div>

<footer>
    © 2026 CIZA GROUP — Tous droits réservés. | 
    <a href="confidentialite.html">Politique de confidentialité</a> — 
    <a href="conditions.html">Conditions d’utilisation</a>
</footer>

<script>
function setLang(l){
    document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = el.dataset[l];
    });
    document.querySelectorAll(".lang-switch span").forEach(el=>{
        el.classList.remove("active");
    });
    document.getElementById("lg-"+l).classList.add("active");
}
setLang("fr");
</script>

</body>
</html>
