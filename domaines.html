<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Domaines — CIZA GROUP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" href="favicone.png" />

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f4f6fa;
      color: #1a1f25;
      opacity: 0;
      animation: fadePage 0.7s ease-out forwards;
    }

    @keyframes fadePage {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= HEADER ================= */
    header {
      background: #004AAD;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 3000;
    }

    .logo { height: 80px; width: auto; }

    @media(max-width:480px){
      .logo { height: 68px; }
    }

    .lang-switch {
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin: 0 4px;
    }

    .header-gold-line {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: #F2B840;
    }

    /* MENU MOBILE */
    .menu-btn { width: 32px; cursor:pointer; }
    .menu-btn div {
      height: 4px; background:#F2B840; margin: 5px 0; border-radius:3px;
    }

    nav {
      position: fixed;
      top: 0;
      right: -270px;
      width: 250px;
      height: 100%;
      background: #004AAD;
      padding-top: 90px;
      transition: 0.35s;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 3500;
    }

    nav.nav-open { right: 0 !important; }

    nav a {
      color: white;
      font-size: 20px;
      padding-left: 20px;
      text-decoration: none;
    }

    /* ================= TITRE DE PAGE ================= */
    .page-title {
      text-align: center;
      padding: 40px 20px;
      font-size: 34px;
      font-weight: 900;
      color: #004AAD;
    }

    /* ================= DOMAINES ================= */
    .domaine-box {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .section {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
      margin-bottom: 30px;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .section:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }

    .section h3 {
      font-size: 24px;
      font-weight: 900;
      color: #004AAD;
      margin-bottom: 12px;
    }

    .section p {
      font-size: 17px;
      line-height: 1.5;
      margin: 0;
    }

    /* ================= BOUTON RETOUR ================= */
    .btn-retour {
      display: block;
      margin: 30px auto;
      width: fit-content;
      padding: 12px 30px;
      background: #F2B840;
      color: #0a0a0a;
      font-size: 18px;
      font-weight: 800;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    /* ================= FOOTER ================= */
    footer {
      background:#0A0F1A; color:white;
      padding: 60px 20px; margin-top: 40px;
    }

    .footer-grid {
      max-width: 1200px; margin:auto;
      display:grid; gap:30px;
      grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    }

    .footer-title {
      color:#F2B840; font-size:20px; font-weight:900;
    }
    footer a { color:#dfe6f5; display:block; margin:6px 0; }
  </style>

  <script>
    /* MENU AUTO-CLOSE */
    function toggleMenu(){
      const nav = document.getElementById("nav");
      nav.classList.toggle("nav-open");

      document.querySelectorAll("#nav a").forEach(a=>{
        a.onclick = ()=> nav.classList.remove("nav-open");
      });
    }

    /* MULTILINGUE */
    function setLang(l){
      document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = el.dataset[l];
      });
      localStorage.setItem("lang", l);
    }

    window.onload = ()=>{
      setLang(localStorage.getItem("lang") || "fr");
    };
  </script>
</head>

<body>

<header>

  <div>
    <span class="lang-switch" onclick="setLang('fr')">FR</span> |
    <span class="lang-switch" onclick="setLang('en')">EN</span>
  </div>

  <div class="menu-btn" onclick="toggleMenu()">
    <div></div><div></div><div></div>
  </div>

  <div class="header-gold-line"></div>
</header>

<!-- MENU MOBILE -->

  <a href="a-propos.html" data-fr="À propos" data-en="About"></a>
  <a href="contact.html" data-fr="Contact" data-en="Contact"></a>
</nav>

<!-- TITRE -->

  </div>

</div>

<a href="index.html" class="btn-retour" data-fr="Retour" data-en="Back"></a>

<!-- FOOTER -->
<footer>

  <div class="footer-grid">

      <h3 class="footer-title">CIZA GROUP</h3>
      <p>Écosystème de Services — Burundi | Canada</p>
      <p>🇧🇮 +257 79945007</p>

      <p>Email : infos@cizagroup.com</p>
    </div>

    <div>
      <h3 class="footer-title">Navigation</h3>
      <a href="index.html">Accueil</a>
      <a href="domaines.html">Domaines</a>
      <a href="a-propos.html">À propos</a>
      <a href="business-diaspora.html">Diaspora</a>
      <a href="contact.html">Contact</a>

    <div>

</html>
