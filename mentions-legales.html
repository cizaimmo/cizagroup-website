<script>
(function(){
"use strict";
var KEY="cgv_verified";
var overlay=document.getElementById("cgv-overlay");
if(!overlay){return;}
function remove(){if(overlay&&overlay.parentNode){overlay.parentNode.removeChild(overlay);overlay=null;}}
var kill=setTimeout(remove,2500);
var verified=false;
try{verified=!!(window.sessionStorage&&sessionStorage.getItem(KEY));}catch(e){}
if(!verified){try{if(window.sessionStorage){sessionStorage.setItem(KEY,"1");}}catch(e){}}
if(verified){clearTimeout(kill);remove();return;}
var TEXTS={
fr:{run:"Vérification de la connexion sécurisée…",done:"Connexion sécurisée ✓"},
en:{run:"Verifying the secure connection…",done:"Secure connection ✓"},
ki:{run:"Turimo kugenzura umutekano w'ihuzwa…",done:"Umutekano w'ihuzwa wemejwe ✓"}
};
var lang="fr";
try{lang=(window.localStorage&&localStorage.getItem("lang"))||"fr";}catch(e){}
if(!TEXTS[lang]){lang="fr";}
var T=TEXTS[lang];
var textEl=document.getElementById("cgv-text");
var fillEl=document.getElementById("cgv-fill");
if(textEl){textEl.textContent=T.run;}
var reduced=false;
try{reduced=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}catch(e){}
var D=reduced?{done:220,fade:340,out:560}:{done:1680,fade:1900,out:2240};
overlay.classList.add("cgv-show");
setTimeout(function(){if(fillEl){fillEl.classList.add("cgv-run");}},40);
setTimeout(function(){if(textEl){textEl.textContent=T.done;}},D.done);
setTimeout(function(){if(overlay){overlay.classList.add("cgv-hide");}},D.fade);
setTimeout(function(){clearTimeout(kill);remove();},D.out);
})();
</script>

<script>
function setLang(l){
    document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = el.dataset[l];
    });
    document.querySelectorAll(".lang-switch span")
        .forEach(s=>s.classList.remove("lang-active"));
    document.getElementById("lg-"+l).classList.add("lang-active");
    document.querySelectorAll(".cg-lang-btn").forEach(b=>b.classList.toggle("cg-on",b.dataset.cglang===l));
}
setLang("fr");

</script>

<script>
/* === MENU PREMIUM CIZA GROUP (cg) : panneau plein ecran === */
(function(){
    var cgPanel = document.getElementById("cg-panel");
    if(!cgPanel) return;
    function cgOpenPanel(){
        cgPanel.classList.add("cg-open");
        cgPanel.setAttribute("aria-hidden","false");
        document.body.classList.add("cg-locked");
        var cgBtn = document.getElementById("cg-menu-btn");
        if(cgBtn) cgBtn.setAttribute("aria-expanded","true");
    }
    function cgClosePanel(){
        cgPanel.classList.remove("cg-open");
        cgPanel.setAttribute("aria-hidden","true");
        document.body.classList.remove("cg-locked");
        var cgBtn = document.getElementById("cg-menu-btn");
        if(cgBtn) cgBtn.setAttribute("aria-expanded","false");
    }
    var cgBtn = document.getElementById("cg-menu-btn");
    if(cgBtn) cgBtn.addEventListener("click", cgOpenPanel);
    var cgBurger = document.getElementById("mobile-open");
    if(cgBurger){
        cgBurger.addEventListener("click", cgOpenPanel);
        cgBurger.addEventListener("keydown", function(e){
            if(e.key === "Enter" || e.key === " "){ e.preventDefault(); cgOpenPanel(); }
        });
    }
    var cgCloseBtn = document.getElementById("cg-close");
    if(cgCloseBtn) cgCloseBtn.addEventListener("click", cgClosePanel);
    cgPanel.querySelectorAll("a").forEach(function(cgLink){
        cgLink.addEventListener("click", cgClosePanel);
    });
    document.addEventListener("keydown", function(e){
        if(e.key === "Escape") cgClosePanel();
    });
    var cgLangBtns = cgPanel.querySelectorAll(".cg-lang-btn");
    cgLangBtns.forEach(function(cgLb){
        cgLb.addEventListener("click", function(){
            cgLangBtns.forEach(function(x){ x.classList.remove("cg-on"); });
            cgLb.classList.add("cg-on");
        });
    });
    var cgBack = document.getElementById("cg-back");
    if(cgBack) cgBack.addEventListener("click", function(){
        var cgRef = document.referrer || "";
        if(window.history.length > 1 && cgRef && cgRef.indexOf(window.location.hostname) !== -1 && cgRef.split("#")[0] !== window.location.href.split("#")[0]){
            window.history.back();
        } else {
            window.location.href = "index.html";
        }
    });
})();
</script>
