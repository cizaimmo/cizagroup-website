<script>
function setLang(l){
    document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = el.dataset[l];
    });
    document.querySelectorAll(".lang-switch span")
        .forEach(s=>s.classList.remove("lang-active"));
    document.getElementById("lg-"+l).classList.add("lang-active");
}

/* === MENU MOBILE STANDARD === */

document.getElementById("mobile-close").onclick = () => { document.getElementById("mobile-menu").style.right = "-100%"; };
document.addEventListener("click", e => { if(!e.target.closest("#mobile-menu") && !e.target.closest("#mobile-open")){ document.getElementById("mobile-menu").style.right = "-100%"; } });
