<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Politique de Confidentialité — CIZA GROUP</title>
<link rel="icon" href="logotransparent.png">

<style>
body{
    margin:0;
    background:#06142e;
    color:white;
    font-family:Arial, sans-serif;
    line-height:1.7;
}
a{color:#F2B840;text-decoration:none;}
h1,h2{color:#F2B840;}

header{
    position:fixed;top:0;left:0;width:100%;
    background:#06142edd;backdrop-filter:blur(6px);
    padding:15px 22px;z-index:999;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid #0e2a50;
}
header img{height:55px;}
.wrapper{
    max-width:900px;margin:auto;padding:140px 20px 50px;
}
.section{
    background:#0b1c34cc;padding:25px;border-radius:16px;
    border:1px solid #12335c;margin-bottom:25px;
}
.lang-switch span{
    margin-left:12px;cursor:pointer;font-weight:bold;opacity:.6;
}
.lang-active{opacity:1;color:#F2B840;}
footer{
    text-align:center;padding:20px;background:#020a16;
    color:white;font-size:13px;margin-top:40px;opacity:.8;
}
</style>
</head>

<body>

<header>
    <img src="logotransparent.png">

    <div class="lang-switch">
        <span onclick="setLang('fr')" id="lg-fr">FR</span>
        <span onclick="setLang('en')" id="lg-en">EN</span>
        <span onclick="setLang('ki')" id="lg-ki">KI</span>
    </div>
</header>

<div class="wrapper">

    <h1 data-fr="Politique de Confidentialité"
        data-en="Privacy Policy"
        data-ki="Ingingo z'Ubumfasoni"></h1>

    <!-- SECTION 1 -->
    <div class="section">
        <h2 data-fr="1. Introduction"
            data-en="1. Introduction"
            data-ki="1. Intangamarara"></h2>

        <p data-fr="CIZA GROUP accorde une grande importance à la protection de vos données personnelles. Cette politique explique comment nous collectons, utilisons, stockons et protégeons vos informations lorsque vous utilisez nos services."
           data-en="CIZA GROUP places great importance on protecting your personal data. This policy explains how we collect, use, store, and protect your information when using our services."
           data-ki="CIZA GROUP irakingira cane ibijanye n'ubuzima bwite bw'uwukoresha. Aya mategeko asigura uburyo dukoresha, dukinga kandi tubika amakuru yanyu."></p>
    </div>

    <!-- SECTION 2 -->
    <div class="section">
        <h2 data-fr="2. Données collectées"
            data-en="2. Data Collected"
            data-ki="2. Amakuru dukura"></h2>

        <p data-fr="Nous collectons uniquement les informations nécessaires pour fournir nos services : nom, email, téléphone, messages envoyés via les formulaires, préférences linguistiques et données techniques anonymes."
           data-en="We collect only the information necessary to provide our services: name, email, phone, form messages, language preferences, and anonymized technical data."
           data-ki="Dukura gusa amakuru akenewe: izina, imeyili, numero ya terefone, ubutumwa bwo mu mafishi, ururimi mukoresha hamwe n'amakuru ya tekiniki atamenyekana."></p>
    </div>

    <!-- SECTION 3 -->
    <div class="section">
        <h2 data-fr="3. Utilisation des données"
            data-en="3. How We Use Data"
            data-ki="3. Uko dukoresha amakuru"></h2>

        <p data-fr="Vos données sont utilisées uniquement pour vous contacter, améliorer nos services, assurer la sécurité, ou répondre à vos demandes."
           data-en="Your data is used only to contact you, improve our services, ensure security, or respond to your requests."
           data-ki="Amakuru yanyu akoreshwa gusa mu kubashikira, gutunganya serivisi, umutekano no kwishura ivyo musavye."></p>
    </div>

    <!-- SECTION 4 -->
    <div class="section">
        <h2 data-fr="4. Partage des données"
            data-en="4. Data Sharing"
            data-ki="4. Guhereza amakuru"></h2>

        <p data-fr="Nous ne vendons jamais vos données. Elles peuvent être partagées uniquement avec nos partenaires techniques (hébergement, email) pour assurer le fonctionnement du service."
           data-en="We never sell your data. It may be shared only with technical partners (hosting, email) to ensure service functionality."
           data-ki="Ntiduhemba canke ntidutangaza amakuru yanyu. Arashobora guhererezwa gusa abafasha mu bijanye n'ikoranabuhanga kugira serivisi ikore neza."></p>
    </div>

    <!-- SECTION 5 -->
    <div class="section">
        <h2 data-fr="5. Sécurité"
            data-en="5. Security"
            data-ki="5. Ubutekaniro"></h2>

        <p data-fr="Nous utilisons des mesures de sécurité renforcées pour protéger vos informations contre l'accès non autorisé."
           data-en="We use enhanced security measures to protect your information from unauthorized access."
           data-ki="Dukoresha uburyo bwinshi bwo gukingira amakuru yanyu kugira ntibinjirwe n'abatabifitiye uruhusha."></p>
    </div>

    <!-- SECTION 6 -->
    <div class="section">
        <h2 data-fr="6. Vos droits"
            data-en="6. Your Rights"
            data-ki="6. Uburenganzira bwanyu"></h2>

        <p data-fr="Vous pouvez demander l’accès, la correction ou la suppression de vos données en nous contactant directement."
           data-en="You may request access, correction, or deletion of your data by contacting us."
           data-ki="Murashobora gusaba guhindurwa canke gukurwaho amakuru yanyu muduhamagaye."></p>
    </div>

    <!-- SECTION 7 -->
    <div class="section">
        <h2 data-fr="7. Contact"
            data-en="7. Contact"
            data-ki="7. Aho mudushikira"></h2>

        <p data-fr="Pour toute question :"
           data-en="For any question:"
           data-ki="Ku bibazo vyose :"></p>

        <p>📧 infos@cizagroup.com<br>📧 business@cizagroup.com</p>
        <p>📍 Bujumbura, Burundi</p>
    </div>

</div>

<footer>
    © 2026 CIZA GROUP — Politique de Confidentialité
</footer>

<script>
function setLang(l){
    document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = el.dataset[l];
    });
    document.querySelectorAll(".lang-switch span")
        .forEach(s=>s.classList.remove("lang-active"));
    document.getElementById("lg-"+l).classList.add("lang-active");
}
setLang("fr");
</script>

</body>
</html>
