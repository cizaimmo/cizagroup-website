<!-- ======== JAVASCRIPT ======== -->
<script>
// MENU
function toggleMenu(){document.getElementById("nav").classList.toggle("nav-open");}

// MULTILINGUE
function setLang(l){
 document.querySelectorAll("[data-fr]").forEach(el=>{el.innerHTML = el.dataset[l];});
 localStorage.setItem("lang",l);
 document.querySelectorAll(".lang-switch").forEach(e=>e.classList.remove("active"));
 document.querySelector(".lang-switch."+l)?.classList.add("active");
}
window.onload = ()=>{
 const L = localStorage.getItem("lang") || "fr";
 setLang(L);
};

// ACCORDIONS
document.querySelectorAll(".accordion-header").forEach(header=>{
 header.addEventListener("click",()=>{
   const acc = header.parentElement;
   acc.classList.toggle("open");
 });
});

// SCROLL TOP BUTTON
window.addEventListener("scroll",()=>{
 if(window.scrollY>200) document.getElementById("topBtn").style.display="flex";
 else document.getElementById("topBtn").style.display="none";
});
function scrollTopSmooth(){window.scrollTo({top:0,behavior:"smooth"});}

// COOKIE
function acceptCookies(){localStorage.setItem("cookie","yes");document.getElementById("cookie-banner").style.display="none";}
function declineCookies(){localStorage.setItem("cookie","no");document.getElementById("cookie-banner").style.display="none";}
setTimeout(()=>{if(!localStorage.getItem("cookie"))document.getElementById("cookie-banner").style.display="flex";},1000);

// AVIS (client side temporary)
function addAvis(){
 let name = document.getElementById("avis-name").value;
 let pays = document.getElementById("avis-pays").value;
 let msg  = document.getElementById("avis-msg").value;

 if(!name || !msg){alert("Veuillez remplir nom + message");return;}

 let avis = document.createElement("div");
 avis.className="avis";
 avis.innerHTML = `<h4>${pays ? pays : "🌍"}</h4><p>${msg}</p>`;

 document.getElementById("avis-list").prepend(avis);

 document.getElementById("avis-name").value="";
 document.getElementById("avis-pays").value="";
 document.getElementById("avis-msg").value="";
}
</script>
