<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CIZA GROUP – Business Diaspora</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* -------------------- GLOBAL -------------------- */
body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: #f5f6fa;
    overflow-x: hidden;
}

h2 {
    font-weight: 800;
    color: #0A3D91;
}

section {
    padding: 70px 20px;
    max-width: 1200px;
    margin: auto;
}

/* -------------------- HEADER PREMIUM -------------------- */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 28px;
    z-index: 99999;
    border-bottom: 1px solid rgba(0,0,0,0.10);
}

.header-logo {
    font-size: 1.6rem;
    font-weight: 900;
    color: #0A3D91;
    letter-spacing: 1px;
}

header nav a {
    color: #0A3D91;
    font-weight: 600;
    margin-left: 22px;
    text-decoration: none;
    transition: 0.25s;
}
header nav a:hover {
    color: #F2B840;
}

/* MULTILINGUE */
.lang-switcher {
    display: flex;
    gap: 8px;
}
.lang-switcher img {
    width: 28px;
    cursor: pointer;
    border-radius: 4px;
    transition: 0.2s;
}
.lang-switcher img:hover {
    transform: scale(1.1);
}

/* -------------------- SLIDER -------------------- */
.hero {
    margin-top: 70px;
}

.hero-slider {
    position: relative;
    width: 100%;
    height: 85vh;
    overflow: hidden;
}

.slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center top;
    opacity: 0;
    transition: opacity 1.2s ease;
}
.slide.active {
    opacity: 1;
}

.hero-content {
    position: absolute;
    bottom: 12%;
    left: 6%;
    width: 90%;
    max-width: 650px;
    color: white;
    text-shadow: 0 4px 14px rgba(0,0,0,0.60);
    animation: fadeInUp 1.4s ease;
}

.hero-title {
    font-size: 3.1rem;
    font-weight: 900;
}

.hero-sub {
    margin-top: 10px;
    font-size: 1.25rem;
    font-weight: 400;
}

.hero-btn {
    margin-top: 22px;
    display: inline-block;
    padding: 16px 28px;
    background: #F2B840;
    color: #000;
    font-weight: 700;
    border-radius: 12px;
    text-decoration: none;
    font-size: 1.15rem;
    transition: 0.3s;
}
.hero-btn:hover { background: #d3a034; }

/* ANIMATIONS */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>
    <div class="header-logo">CIZA GROUP</div>

    <nav>
        <a href="index.html" data-fr="Accueil" data-en="Home" data-ki="Ahabanza">Accueil</a>
        <a href="#programmes" data-fr="Programmes" data-en="Programs" data-ki="Porogarama">Programmes</a>
        <a href="#contact" data-fr="Contact" data-en="Contact" data-ki="Tuvugishe">Contact</a>
    </nav>

    <div class="lang-switcher">
        <img src="https://flagcdn.com/fr.svg" onclick="setLang('fr')" title="Français">
        <img src="https://flagcdn.com/gb.svg" onclick="setLang('en')" title="English">
        <img src="https://flagcdn.com/bi.svg" onclick="setLang('ki')" title="Kirundi">
    </div>
</header>

<!-- HERO / SLIDER -->
<section class="hero">

<div class="hero-slider">

    <div class="slide active"
         style="background-image:url('038E3EC2-468F-4C6B-91DD-D077368508FD.png');"></div>

    <div class="slide"
         style="background-image:url('0CD5D803-FB19-4139-B96D-CABF88F5964C.png');"></div>

    <div class="slide"
         style="background-image:url('752313D3-3321-4323-BE30-ACA03C349863.png');"></div>

    <div class="hero-content">
        <div class="hero-title"
            data-fr="Programme Business Diaspora"
            data-en="Diaspora Business Program"
            data-ki="Porogarama y'Abari mu Mahanga"></div>

        <div class="hero-sub"
            data-fr="Investissez, dirigez et développez vos projets au Burundi en toute sérénité."
            data-en="Invest, manage and grow your projects in Burundi with full confidence."
            data-ki="Ishoramari, imicungire n'iterambere ry'imishinga yawe mu mutekano."></div>

        <a href="#programmes" class="hero-btn"
           data-fr="Rejoindre le programme"
           data-en="Join the Program"
           data-ki="Kwiyandikisha"></a>
    </div>

</div>
</section>
