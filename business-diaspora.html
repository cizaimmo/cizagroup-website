<script>
// MENU SLIDE
function toggleMenu(){
 document.getElementById("nav").classList.toggle("nav-open");
}

// LANG SWITCH
function setLang(l){
 document.querySelectorAll("[data-fr]").forEach(el=>{
  el.innerHTML = el.dataset[l];
 });
 localStorage.setItem("lang",l);
 document.querySelectorAll(".lang-switch").forEach(e=>e.classList.remove("active"));
 document.querySelector(".lang-switch."+l)?.classList.add("active");
}
window.onload = ()=>{ setLang(localStorage.getItem("lang")||"fr"); };

// FAQ
document.querySelectorAll(".faq-box").forEach(q=>{
 q.addEventListener("click",()=>{
  let a=q.querySelector(".faq-answer");
  a.style.display = (a.style.display==="block" ? "none" : "block");
 });
});

// SCROLL TOP
window.addEventListener("scroll",()=>{
 document.getElementById("topBtn").style.display =
  window.scrollY > 200 ? "flex" : "none";
});
function scrollTopSmooth(){
 window.scrollTo({top:0,behavior:"smooth"});
}

// COOKIES
function acceptCookies(){
 localStorage.setItem("cookie","yes");
 document.getElementById("cookie-banner").style.display="none";
}
function declineCookies(){
 localStorage.setItem("cookie","no");
 document.getElementById("cookie-banner").style.display="none";
}
setTimeout(()=>{
 if(!localStorage.getItem("cookie"))
   document.getElementById("cookie-banner").style.display="flex";
},900);

// AVIS
function addAvis(){
 let name=document.getElementById("avis-name").value;
 let pays=document.getElementById("avis-pays").value;
 let msg=document.getElementById("avis-msg").value;

 if(!name||!msg){alert("Veuillez remplir nom + message");return;}

 let box=document.createElement("div");
 box.className="avis";
 box.style = "background:#111824;padding:20px;border-radius:14px;border-left:4px solid #F2B840;";
 box.innerHTML = `<h4>${pays||"🌍"} — ${name}</h4><p>${msg}</p>`;

 document.getElementById("avis-list").prepend(box);

 document.getElementById("avis-name").value="";
 document.getElementById("avis-pays").value="";
 document.getElementById("avis-msg").value="";
}
</script>
