<!-- SCRIPTS -->
<script>
function openMenu(){document.getElementById("mobileMenu").style.right="0";}
function closeMenu(){document.getElementById("mobileMenu").style.right="-100%";}

/* MULTILINGUE */
let currentLang="fr";
function toggleLang(){
    currentLang=(currentLang==="fr")?"en":"fr";
    updateLang();
}
function updateLang(){
    document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = el.getAttribute(`data-${currentLang}`);
    });
}
updateLang();

/* COOKIES */
function acceptCookies(){
    localStorage.setItem("cookies_ciza","yes");
    document.getElementById("cookieBanner").style.display="none";
}
function declineCookies(){
    localStorage.setItem("cookies_ciza","no");
    document.getElementById("cookieBanner").style.display="none";
}
window.onload=()=>{
    if(!localStorage.getItem("cookies_ciza")){
        document.getElementById("cookieBanner").style.display="block";
    }
};
</script>
