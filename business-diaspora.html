<script>
// FAQ
document.querySelectorAll(".faq-box").forEach(box=>{
    box.addEventListener("click",()=>{
        let ans = box.querySelector(".faq-answer");
        ans.style.display = ans.style.display==="block" ? "none" : "block";
    });
});

// Scroll top
window.addEventListener("scroll",()=>{
    document.getElementById("topBtn").style.display =
        window.scrollY > 200 ? "flex" : "none";
});
function scrollTopSmooth(){
    window.scrollTo({top:0,behavior:"smooth"});
}

// Cookies
function acceptCookies(){
    localStorage.setItem("cookie","yes");
    document.getElementById("cookie-banner").style.display="none";
}
function declineCookies(){
    localStorage.setItem("cookie","no");
    document.getElementById("cookie-banner").style.display="none";
}
setTimeout(()=>{
    if(!localStorage.getItem("cookie"))
        document.getElementById("cookie-banner").style.display="flex";
},1000);

// Avis
function addAvis(){
    let name=document.getElementById("avis-name").value;
    let pays=document.getElementById("avis-pays").value;
    let msg=document.getElementById("avis-msg").value;

    if(!name||!msg){
        alert("Nom + Message requis");
        return;
    }

    let box=document.createElement("div");
    box.className="avis";
    box.innerHTML=`<h4>${pays||"🌍"}</h4><p>${msg}</p>`;

    document.getElementById("avis-list").prepend(box);

    document.getElementById("avis-name").value="";
    document.getElementById("avis-pays").value="";
    document.getElementById("avis-msg").value="";
}
