<!-- ================= SCRIPTS ================= -->
<script>
/* ================= MENU MOBILE ================= */
function openMenu(){
    document.getElementById("mobile-menu").style.right = "0";
}
function closeMenu(){
    document.getElementById("mobile-menu").style.right = "-100%";
}

/* ================= LANGUE FR / EN ================= */
function setLang(lang){
    document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = (lang==="fr") ? el.getAttribute("data-fr") : el.getAttribute("data-en");
    });

    document.getElementById("lang-fr").classList.remove("active-lang");
    document.getElementById("lang-en").classList.remove("active-lang");

    if(lang==="fr"){
        document.getElementById("lang-fr").classList.add("active-lang");
    } else {
        document.getElementById("lang-en").classList.add("active-lang");
    }

    localStorage.setItem("lang", lang);
}

document.getElementById("lang-btn").addEventListener("click", ()=>{
    const menu = document.getElementById("lang-menu");
    menu.style.display = (menu.style.display==="block") ? "none" : "block";
});

window.addEventListener("click", (e)=>{
    if(!e.target.closest("#lang-btn") && !e.target.closest("#lang-menu")){
        document.getElementById("lang-menu").style.display = "none";
    }
});

window.addEventListener("load", ()=>{
    const saved = localStorage.getItem("lang") || "fr";
    setLang(saved);
});


/* ================= SCROLL TOP ================= */
const scrollBtn=document.createElement("div");
scrollBtn.id="scrollTop";
scrollBtn.innerHTML="↑";
scrollBtn.style.position="fixed";
scrollBtn.style.bottom="80px";
scrollBtn.style.right="25px";
scrollBtn.style.background="#F2B840";
scrollBtn.style.color="#0B1A33";
scrollBtn.style.padding="12px 18px";
scrollBtn.style.borderRadius="50%";
scrollBtn.style.fontWeight="900";
scrollBtn.style.cursor="pointer";
scrollBtn.style.display="none";
scrollBtn.style.boxShadow="0 6px 14px rgba(0,0,0,.4)";
scrollBtn.style.zIndex="9999";
document.body.appendChild(scrollBtn);

scrollBtn.addEventListener("click", ()=>{
    window.scrollTo({top:0, behavior:"smooth"});
});

window.addEventListener("scroll", ()=>{
    scrollBtn.style.display = (window.scrollY>300) ? "block" : "none";
});


/* ================= ANIMATIONS ================= */
const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting) entry.target.classList.add("fade-in");
    });
});

document.querySelectorAll(".service-card, .cta, .cta-secondary")
.forEach(el=>observer.observe(el));
</script>
