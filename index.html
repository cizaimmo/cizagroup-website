<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CIZA GROUP — Écosystème de Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/cizaimmo/cizagroup-website/main/favicone.png">

  <style>

    /* GLOBAL FIX */
    html, body {
      overflow-x: hidden !important;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f7f9fc;
      color: #1a1f25;
    }

    /* HEADER */
    header {
      background: #0A3D91;
      padding: 12px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 9999;
      height: 70px;
    }

    header img {
      width: 150px;
    }

    /* LANG SWITCH */
    .lang-switch {
      position: absolute;
      right: 70px;
      top: 22px;
      font-size: 15px;
      font-weight: 600;
    }

    .lang-switch a {
      color: white;
      text-decoration: none;
      margin: 0 4px;
    }

    /* MENU BURGER */
    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: block;
      z-index: 1100;
    }

    .menu-btn div {
      width: 27px;
      height: 3px;
      background: #F2B840;
      margin: 5px 0;
      border-radius: 2px;
      transition: 0.3s;
    }

    /* NAV MOBILE */
    nav {
      position: fixed;
      top: 0;
      right: -260px;
      width: 250px;
      height: 100%;
      background: #0A3D91;
      padding-top: 90px;
      transition: 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 1000;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding-left: 25px;
      font-weight: 500;
    }

    .nav-open {
      right: 0 !important;
    }

    /* HERO */
    #hero {
      background-image: url('https://raw.githubusercontent.com/cizaimmo/cizagroup-website/main/hero-premium.png');
      height: 70vh;
      max-width: 100%;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #hero h1 {
      color: white;
      font-size: 32px;
      font-weight: 900;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
      margin-bottom: 10px;
    }

    #hero h3 {
      color: white;
      margin-top: 12px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .btn-gold {
      margin-top: 25px;
      background: #F2B840;
      color: #0A3D91;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
    }

    @media (max-width: 600px) {
      #hero { height: 62vh; }
      #hero h1 { font-size: 22px; }
      #hero h3 { font-size: 13px; }
    }

    /* DOMAINES SECTION */
    .domaines-section {
      padding: 40px 20px;
      text-align: center;
      max-width: 1200px;
      margin: auto;
    }

    .domaines-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .domaine-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.09);
      text-align: center;
      font-weight: 700;
      color: #0A3D91;
      text-decoration: none;
      transition: 0.3s;
      font-size: 18px;
    }

    .domaine-card:hover {
      transform: translateY(-5px);
    }

    /* FOOTER 15/10 */
    .footer {
      background: #1c273a;
      padding: 20px 0;
      width: 100%;
      text-align: center;
      color: white;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto 15px auto;
      padding: 0 20px;
    }

    .footer-contact h3 {
      color: #ffcc55;
      margin-bottom: 8px;
    }

    .footer-contact p {
      margin: 3px 0;
      font-size: 15px;
    }

    .footer-nav {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .footer-nav a {
      color: white;
      text-decoration: none;
      margin: 4px 0;
      font-size: 15px;
    }

    .footer-bottom {
      font-size: 14px;
      color: #ddd;
      margin-top: 5px;
    }

    @media(max-width:768px) {
      .footer-top {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }
    }

    /* CHATBOT WHATSAPP */
    .whatsapp-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #25D366;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 35px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .whatsapp-menu {
      position: fixed;
      bottom: 95px;
      right: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      padding: 15px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
    }

    .whatsapp-menu a {
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      background: #f5f5f5;
      color: #0A3D91;
      text-align: center;
    }

    .whatsapp-menu a:hover {
      background: #e8e8e8;
    }

  </style>

  <!-- MULTILINGUE SCRIPT -->
  <script>
    const translations = {
      fr: {
        hero_title: "Écosystème de Services | Burundi",
        hero_desc: "Mobilité | Immobilier | Logistique | Marketing | Technologies",
        discover: "Découvrir nos domaines",
        domaines_title: "Domaines de Services",
        domaines_mobilite: "Mobilité",
        domaines_immobilier: "Immobilier",
        domaines_logistique: "Logistique",
        footer_contact: "Contacts :",
        footer_copy: "© 2026 CIZA GROUP — Écosystème de Services | Burundi. Tous droits réservés."
      },

      en: {
        hero_title: "Service Ecosystem | Burundi",
        hero_desc: "Mobility | Real Estate | Logistics | Marketing | Technologies",
        discover: "Discover our domains",
        domaines_title: "Service Domains",
        domaines_mobilite: "Mobility",
        domaines_immobilier: "Real Estate",
        domaines_logistique: "Logistics",
        footer_contact: "Contacts:",
        footer_copy: "© 2026 CIZA GROUP — Service Ecosystem | Burundi. All rights reserved."
      }
    };

    function setLang(lang) {
      localStorage.setItem("lang", lang);
      document.querySelector("[data-lang='hero_title']").innerHTML = translations[lang].hero_title;
      document.querySelector("[data-lang='hero_desc']").innerHTML = translations[lang].hero_desc;
      document.querySelector("[data-lang='discover']").innerHTML = translations[lang].discover;
      document.querySelector("[data-lang='domaines_title']").innerHTML = translations[lang].domaines_title;
      document.querySelector("[data-lang='domaines_mobilite']").innerHTML = translations[lang].domaines_mobilite;
      document.querySelector("[data-lang='domaines_immobilier']").innerHTML = translations[lang].domaines_immobilier;
      document.querySelector("[data-lang='domaines_logistique']").innerHTML = translations[lang].domaines_logistique;
      document.querySelector("[data-lang='footer_contact']").innerHTML = translations[lang].footer_contact;
      document.querySelector("[data-lang='footer_copy']").innerHTML = translations[lang].footer_copy;
    }

    window.onload = () => {
      const lang = localStorage.getItem("lang") || "fr";
      setLang(lang);
    };

    function toggleMenu() {
      document.getElementById("nav").classList.toggle("nav-open");
    }

    function toggleWhatsApp() {
      const menu = document.getElementById("whatsappMenu");
      menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    }
  </script>

</head>

<body>

<!-- HEADER -->
<header>
  <img src="https://raw.githubusercontent.com/cizaimmo/cizagroup-website/main/horizontallogo.png">

  <div class="lang-switch">
    <a href="#" onclick="setLang('fr')">FR</a> |
    <a href="#" onclick="setLang('en')">EN</a>
  </div>

  <button class="menu-btn" onclick="toggleMenu()">
    <div></div><div></div><div></div>
  </button>
</header>

<!-- NAVIGATION -->
<nav id="nav">
  <a href="index.html">Accueil</a>
  <a href="a-propos.html">À propos</a>
  <a href="domaines.html">Domaines</a>
  <a href="business-diaspora.html">Diaspora</a>
  <a href="contact.html">Contact</a>
  <a href="legales.html">Mentions légales</a>
  <a href="confidentialite.html">Confidentialité</a>
</nav>

<!-- HERO -->
<section id="hero">
  <div>
    <h1 data-lang="hero_title"></h1>
    <h3 data-lang="hero_desc"></h3>
    <a class="btn-gold" href="domaines.html" data-lang="discover"></a>
  </div>
</section>

<!-- DOMAINES -->
<section class="domaines-section">
  <h2 data-lang="domaines_title"></h2>

  <div class="domaines-grid">
    <a href="mobilite.html" class="domaine-card" data-lang="domaines_mobilite"></a>
    <a href="immobilier.html" class="domaine-card" data-lang="domaines_immobilier"></a>
    <a href="logistique.html" class="domaine-card" data-lang="domaines_logistique"></a>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-top">
      <div class="footer-contact">
          <h3 data-lang="footer_contact"></h3>
          <p>🇧🇮 +257 79945007 | 🇨🇦 +1 514 502 9503</p>
          <p>Email : infos@cizagroup.com</p>
          <p>Instagram : @cizagroup_official</p>
      </div>

      <div class="footer-nav">
          <a href="legales.html">Mentions légales</a>
          <a href="confidentialite.html">Confidentialité</a>
          <a href="contact.html">Contact</a>
          <a href="business-diaspora.html">Diaspora</a>
      </div>
  </div>

  <div class="footer-bottom" data-lang="footer_copy"></div>
</footer>

<!-- CHATBOT -->
<div class="whatsapp-btn" onclick="toggleWhatsApp()">💬</div>

<div class="whatsapp-menu" id="whatsappMenu">
    <a href="https://wa.me/25779945007">🇧🇮 WhatsApp Burundi</a>
    <a href="https://wa.me/15145029503">🇨🇦 WhatsApp Canada</a>
</div>

</body>
</html>
