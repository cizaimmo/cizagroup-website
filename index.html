<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CIZA GROUP — Écosystème de Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f7f9fc;
      color: #1a1f25;
    }

    /* HEADER */
    header {
      background: #0A3D91;
      padding: 12px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header img {
      width: 140px;
    }

    /* MENU BURGER */
    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
    }
    .menu-btn div {
      width: 28px;
      height: 3px;
      background: #F2B840;
      margin: 5px 0;
      border-radius: 2px;
    }

    /* SLIDE MENU */
    #nav {
      position: fixed;
      top: 0;
      right: -260px;
      width: 240px;
      height: 100%;
      background: #0A3D91;
      padding-top: 80px;
      transition: 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-left: 25px;
      z-index: 2000;
    }
    #nav a {
      color: white;
      font-size: 18px;
      text-decoration: none;
    }
    .nav-open {
      right: 0;
    }

    /* BACKDROP (empêche HERO de bloquer les clics) */
    #backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.45);
      z-index: 1500;
    }
    #backdrop.show {
      display: block;
    }

    /* HERO */
    #hero {
      position: relative;
      height: 83vh;
      background-image: url('hero-premium.png');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 0 20px;
    }
    #hero h1 {
      font-size: 34px;
      font-weight: 900;
      text-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }
    #hero .line {
      width: 90px;
      height: 5px;
      background: #F2B840;
      margin: 15px auto;
      border-radius: 12px;
    }
    #hero .domains {
      font-size: 20px;
      margin-top: 5px;
      opacity: 0.95;
    }

    .cta-btn {
      margin-top: 25px;
      background: #F2B840;
      padding: 15px 28px;
      border-radius: 40px;
      font-size: 20px;
      color: #1a1f25;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.25);
    }

    @media (max-width: 600px) {
      #hero h1 { font-size: 26px; }
      #hero .domains { font-size: 16px; }
    }

    /* FOOTER */
    footer {
      background:#1b1f24;
      color:white;
      text-align:center;
      padding:35px 20px;
      margin-top:40px;
    }
    footer a {
      color:white;
      text-decoration:none;
      margin: 0 10px;
      opacity: 0.8;
    }
  </style>

  <script>
    function toggleMenu() {
      let nav = document.getElementById("nav");
      let backdrop = document.getElementById("backdrop");

      nav.classList.toggle("nav-open");
      backdrop.classList.toggle("show");
    }
  </script>
</head>

<body>

<div id="backdrop" onclick="toggleMenu()"></div>

<header>
  <img src="horizontallogo.png">
  <button class="menu-btn" onclick="toggleMenu()">
    <div></div><div></div><div></div>
  </button>
</header>

<nav id="nav">
  <a href="index.html">Accueil</a>
  <a href="business-diaspora.html">Diaspora</a>
  <a href="contact.html">Contact</a>
  <a href="legales.html">Mentions légales</a>
  <a href="confidentialite.html">Confidentialité</a>
</nav>

<!-- HERO -->
<section id="hero">
  <h1>Écosystème de Services — Burundi | Canada</h1>
  <div class="line"></div>
  <div class="domains">Mobilité • Immobilier • Logistique • Diaspora</div>

  <button class="cta-btn" onclick="location.href='business-diaspora.html'">
    Découvrir la Diaspora
  </button>
</section>

<!-- FOOTER -->
<footer>
  <p>2026 CIZA GROUP — Écosystème de Services | Burundi. Tous droits réservés.</p>

  <a href="legales.html">Mentions légales</a> |
  <a href="confidentialite.html">Confidentialité</a>
</footer>

</body>
</html>
