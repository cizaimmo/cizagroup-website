<script>
/* === MENU MOBILE === */
document.getElementById("mobile-open").onclick = () => {
    document.getElementById("mobile-menu").style.right = "0";
};
document.getElementById("mobile-close").onclick = () => {
    document.getElementById("mobile-menu").style.right = "-100%";
};
document.addEventListener("click", e => {
    if(!e.target.closest("#mobile-menu") && !e.target.closest("#mobile-open")){
        document.getElementById("mobile-menu").style.right = "-100%";
    }
});


/* === MULTILINGUE FR / EN === */
function switchLang(){
    let current = localStorage.getItem("lang") || "fr";
    let next = current === "fr" ? "en" : "fr";
    localStorage.setItem("lang", next);
    applyLang(next);
}

function applyLang(lang){
    document.querySelectorAll("[data-fr]").forEach(el => {
        el.textContent = lang === "fr" ? el.dataset.fr : el.dataset.en;
    });
}

document.getElementById("lang-btn").onclick = switchLang;

document.addEventListener("DOMContentLoaded", () => {
    let saved = localStorage.getItem("lang") || "fr";
    applyLang(saved);
});


/* === SCROLL TO TOP === */
const scrollBtn = document.createElement("div");
scrollBtn.innerHTML = "↑";
scrollBtn.style.position = "fixed";
scrollBtn.style.bottom = "90px";
scrollBtn.style.right = "25px";
scrollBtn.style.background = "#F2B840";
scrollBtn.style.color = "#0B1A33";
scrollBtn.style.padding = "12px 18px";
scrollBtn.style.borderRadius = "50%";
scrollBtn.style.fontWeight = "900";
scrollBtn.style.cursor = "pointer";
scrollBtn.style.boxShadow = "0 6px 14px rgba(0,0,0,.4)";
scrollBtn.style.zIndex = "3000";
scrollBtn.style.display = "none";
document.body.appendChild(scrollBtn);

scrollBtn.onclick = () => window.scrollTo({top:0, behavior:"smooth"});

window.addEventListener("scroll", ()=>{
    scrollBtn.style.display = (window.scrollY > 300) ? "block" : "none";
});


/* === ANIMATIONS === */
const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
        if(e.isIntersecting){
            e.target.style.opacity = 1;
            e.target.style.transform = "translateY(0)";
        }
    });
});
document.querySelectorAll(".services-card, .cta, .cta-secondary")
.forEach(el => {
    el.style.opacity = 0;
    el.style.transform = "translateY(20px)";
    el.style.transition = "0.7s ease-out";
    observer.observe(el);
});
</script>
