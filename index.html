<!DOCTYPE html>
<html lang="fr">
<head>

            justify-content: center;
            align-items: center;
            padding: 25px 0;

            border-bottom: 1px solid #444;
        }

        header img {
            height: 130px;

        .hero {

            padding: 15px 35px;

            color: #000;
