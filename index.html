/* HERO */

  height:72vh;
  background-image:url('https://raw.githubusercontent.com/cizaimmo/cizagroup-website/95e5c3b212be1a7c1ae3670ec6ae45b6aac6b401/hero-premium.png');

  display:flex; justify-content:center; align-items:center; text-align:center;
}
#hero .overlay{
  position:absolute; inset:0; background:rgba(0,0,0,0.35);
}
#hero h1{
  position:relative; color:white; font-size:44px; font-weight:900;
}
#hero h2{
  position:relative; color:#F2B840; margin-top:10px; font-size:22px;

/* SERVICES */
.services{
  max-width:1200px; margin:60px auto; padding:20px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:22px;
}
.service-card{
  background:white; border-radius:14px; padding:25px; text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,0.08);
  transition:0.3s; border-top:4px solid #F2B840;
}
.service-card:hover{
  transform:translateY(-5px); box-shadow:0 8px 24px rgba(0,0,0,0.12);
}
.service-card a{
  text-decoration:none; color:#0A3D91; font-weight:700; font-size:18px;
}

/* METEO */
#meteo{
  max-width:1100px; margin:50px auto; padding:10px;
  display:flex; gap:20px; flex-wrap:wrap; justify-content:center;
}
.meteo-box{
  background:white; width:280px; padding:20px; border-radius:12px;
  box-shadow:0 4px 16px rgba(0,0,0,0.08); text-align:center;
}

/* ACTUALITÉS */
#news{
  max-width:1200px; margin:60px auto; padding:20px;
}
.news-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px;
}
.news-card{
  background:white; border-radius:12px; overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
}
.news-card img{ width:100%; height:180px; object-fit:cover; }
.news-card .content{ padding:15px; }

/* FOOTER */
footer{
  background:#0A3D91; color:white; margin-top:60px; padding:35px 20px;
}
footer a{ color:#F2B840; text-decoration:none; font-weight:700; }

/* WHATSAPP CHATBOT */
#whatsapp-bubble{
  position:fixed; bottom:25px; right:25px;
  background:#25D366; width:62px; height:62px; border-radius:50%;
  display:flex; justify-content:center; align-items:center; 
  box-shadow:0 4px 16px rgba(0,0,0,0.25); cursor:pointer; z-index:9999;
}
#whatsapp-bubble img{ width:35px; }

</style>

<script>
// SWITCH LANGUE
function setLang(l){
  document.querySelectorAll("[data-fr]").forEach(el=>{
    el.innerHTML = el.dataset[l];
  });
  localStorage.setItem("lang_home",l);
}
window.onload = ()=>{
  setLang(localStorage.getItem("lang_home") || "fr");
  loadWeather();
  loadNews();
};

// METEO
async function loadWeather(){
  const cities = [
    {name:"Bujumbura", lat:-3.38, lon:29.36, id:"bi"},
    {name:"Montreal", lat:45.50, lon:-73.56, id:"ca"}
  ];
  cities.forEach(async c=>{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,wind_speed_10m`;
    const res = await fetch(url);
    const data = await res.json();
    document.getElementById("temp-"+c.id).innerHTML = data.current.temperature_2m+"°C";
    document.getElementById("wind-"+c.id).innerHTML = data.current.wind_speed_10m+" km/h";
  });
}

// ACTUALITÉS
async function loadNews(){
  const res = await fetch("https://newsdata.io/api/1/news?apikey=pub_33492f89847a5b826ce4d5f87bd&country=bi,ca,us&language=fr,en");
  const data = await res.json();
  const container = document.getElementById("news-list");
  container.innerHTML = "";
  data.results.slice(0,6).forEach(n=>{
    container.innerHTML += `
      <div class="news-card">
        <img src="${n.image_url || 'https://via.placeholder.com/400x200'}">
        <div class="content">
          <h3>${n.title}</h3>
          <p>${(n.description || '').slice(0,120)}...</p>
          <a href="${n.link}" target="_blank">Lire plus</a>
        </div>
      </div>`;
  });
}
</script>
