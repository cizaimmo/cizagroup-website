  <!-- MULTILINGUE SCRIPT -->
  <script>
    function setLang(l) {
      document.querySelectorAll("[data-fr]").forEach(el => {
        el.innerHTML = el.dataset[l];
      });
      localStorage.setItem("lang", l);
    }

    window.onload = () => {
      const l = localStorage.getItem("lang") || "fr";
      setLang(l);
    };

    function toggleMenu() {
      document.getElementById("nav").classList.toggle("nav-open");
    }
  </script>
