<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIZA IMMO</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: white;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        header img {
            width: 160px;
            height: auto;
            filter: drop-shadow(0px 0px 5px rgba(255, 215, 0, 0.4));
        }

        h1 {
            font-size: 36px;
            margin-top: 10px;
            color: #d4af37; /* Or doré */
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        h2.section-title {
            text-align: center;
            font-size: 32px;
            color: #d4af37;
            margin-top: 50px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background-color: #111;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 0px 8px rgba(212,175,55,0.2);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
            height: 220px;
            object-fit: cover;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #d4af37;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            background-color: #111;
            text-align: center;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <img src="A_vector-based_logo_for_&quot;CIZA_IMMO,&quot;_a_real_estate.png" alt="Logo CIZA IMMO">
        <h1>CIZA IMMO</h1>
        <p>Immobilier • Vente • Location • Investissement</p>
    </header>

    <h2 class="section-title">Nos Immeubles</h2>

    <div class="grid">
        <div class="card">
            <img src="immeuble1.jpg" alt="Immeuble 1">
            <h3>Immeuble 1</h3>
            <p>Texte descriptif…</p>
            <a class="btn" href="#">Voir plus</a>
        </div>

        <div class="card">
            <img src="immeuble2.jpg" alt="Immeuble 2">
            <h3>Immeuble 2</h3>
            <p>Texte descriptif…</p>
            <a class="btn" href="#">Voir plus</a>
        </div>

        <div class="card">
            <img src="immeuble3.jpg" alt="Immeuble 3">
            <h3>Immeuble 3</h3>
            <p>Texte descriptif…</p>
            <a class="btn" href="#">Voir plus</a>
        </div>
    </div>

    <footer>
        © 2025 CIZA IMMO — Tous droits réservés
    </footer>

</body>
</html>
