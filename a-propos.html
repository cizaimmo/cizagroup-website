<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>À propos — CIZA GROUP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin:0;
      padding:0;
      font-family: Inter, Arial, sans-serif;
      background:#f7f9fc;
      color:#1b2432;
      line-height:1.6;
    }

    /* HERO CEO */
    #hero-ceo {
      background:#0A3D91;
      padding:60px 20px;
      text-align:center;
      color:white;
      position:relative;
      overflow:hidden;
    }

    #hero-ceo .gold-ring {
      width:180px;
      height:180px;
      border-radius:50%;
      border:5px solid #F2B840;
      margin:0 auto 20px;
      overflow:hidden;
      background:white;
      padding:6px;
    }

    #hero-ceo img {
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
    }

    #hero-ceo h1 {
      font-size:32px;
      font-weight:900;
      margin-bottom:6px;
    }

    #hero-ceo h2 {
      font-size:18px;
      color:#F2B840;
      font-weight:700;
      margin-top:0;
    }

    /* CONTAINER */
    .container {
      max-width:1100px;
      margin:30px auto;
      background:white;
      padding:30px;
      border-radius:14px;
      box-shadow:0 4px 18px rgba(0,0,0,0.08);
    }

    h3 {
      color:#0A3D91;
      font-weight:900;
      border-left:4px solid #F2B840;
      padding-left:10px;
      margin-top:30px;
    }

    /* TIMELINE */
    .timeline {
      border-left:3px solid #0A3D91;
      padding-left:20px;
      margin-top:15px;
    }
    .timeline div {
      margin-bottom:15px;
    }
    .timeline span.year {
      font-weight:900;
      color:#0A3D91;
    }

    /* MULTILINGUE */
    .lang-switch {
      text-align:right;
      margin-bottom:10px;
    }
    .lang-switch button {
      padding:6px 12px;
      border:1px solid #ddd;
      border-radius:6px;
      background:white;
      cursor:pointer;
    }

    @media(max-width:700px){
      #hero-ceo h1 { font-size:26px; }
      #hero-ceo h2 { font-size:15px; }
      #hero-ceo .gold-ring { width:150px; height:150px; }
    }
  </style>

  <!-- Multilingue -->
  <script>
    function setLang(l) {
      document.querySelectorAll("[data-fr]").forEach(el => {
        el.innerHTML = el.dataset[l];
      });
      localStorage.setItem("lang_about", l);
    }
    window.onload = () => {
      const l = localStorage.getItem("lang_about") || "fr";
      setLang(l);
    };
  </script>

</head>
<body>

<!-- HERO CEO -->
<section id="hero-ceo">
  <div class="gold-ring">
    <img src="https://raw.githubusercontent.com/cizaimmo/cizagroup-website/de6cc4921bc9028c6a71f5dd18a8c336662de67e/CEO.png" alt="CEO CIZA GROUP">
  </div>

  <h1 data-fr="CEO — CIZA GROUP" data-en="CEO — CIZA GROUP"></h1>

  <h2 data-fr="Construire le plus grand écosystème de services au Burundi"
      data-en="Building the largest service ecosystem in Burundi"></h2>
</section>

<!-- CONTENU -->
<div class="container">

  <div class="lang-switch">
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
  </div>

  <h3 data-fr="Notre vision" data-en="Our Vision"></h3>
  <p data-fr="
    CIZA GROUP est une entreprise innovante créée avec une ambition claire : offrir au Burundi
    et à sa diaspora un écosystème complet de services modernes, fiables et accessibles.
    Sous la direction du CEO, le groupe développe des solutions qui transforment la mobilité,
    le digital, l'immobilier, la logistique et les services urbains.
  " data-en="
    CIZA GROUP is an innovative company created with a clear ambition: to offer Burundi
    and its diaspora a complete ecosystem of modern, reliable and accessible services.
    Led by the CEO, the group develops solutions that transform mobility, digital services,
    real estate, logistics and urban services.
  "></p>

  <h3 data-fr="Nos services" data-en="Our Services"></h3>
  <p data-fr="
    Le groupe réunit plusieurs branches : CizaRide+, CizaPay+, CizaImmo, CizaDelivery,
    CizaLogistics, CizaTech, CizaMarketing, CizaAcademy, CizaAssist et CizaCarWash+.
    Ensemble, ces services créent une chaîne intégrée permettant aux particuliers,
    entreprises et organisations de bénéficier d'une solution complète.
  " data-en="
    The group brings together several branches: CizaRide+, CizaPay+, CizaImmo,
    CizaDelivery, CizaLogistics, CizaTech, CizaMarketing, CizaAcademy,
    CizaAssist and CizaCarWash+. Together, they create an integrated chain
    allowing individuals, businesses and organizations to benefit from a complete solution.
  "></p>

  <h3 data-fr="Notre mission" data-en="Our Mission"></h3>
  <p data-fr="
    Simplifier le quotidien. Digitaliser les services du Burundi. Offrir des solutions fiables,
    sécurisées et accessibles pour tous — citoyens, entreprises et diaspora.
  " data-en="
    Simplify daily life. Digitize services in Burundi. Provide reliable, secure
    and accessible solutions for citizens, businesses and the diaspora.
  "></p>

  <h3 data-fr="Historique & Croissance" data-en="History & Growth"></h3>
  <div class="timeline">
    <div>
      <span class="year">2022 :</span>
      <span data-fr="Début du projet — développement du noyau CIZA GROUP"
            data-en="Project launch — development of the CIZA GROUP core"></span>
    </div>
    <div>
      <span class="year">2023 :</span>
      <span data-fr="Lancement des premières plateformes digitales"
            data-en="Launch of the first digital platforms"></span>
    </div>
    <div>
      <span class="year">2024 :</span>
      <span data-fr="Expansion vers les services mobilité, immobilier & paiement"
            data-en="Expansion into mobility, real estate & payment services"></span>
    </div>
    <div>
      <span class="year">2025 :</span>
      <span data-fr="Structuration de l'écosystème complet & ouverture diaspora"
            data-en="Structuring of the full ecosystem & diaspora services"></span>
    </div>
  </div>

  <h3 data-fr="Notre équipe" data-en="Our Team"></h3>
  <p data-fr="
    L’entreprise est portée par un réseau d'experts, de chauffeurs, de livreurs,
    de techniciens, d'agents de terrain et de partenaires de la diaspora.
  " data-en="
    The company is supported by a network of experts, drivers, delivery agents,
    technicians, field agents and diaspora partners.
  "></p>

</div>

</body>
</html>
