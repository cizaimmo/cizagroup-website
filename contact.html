<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact — CIZA GROUP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      padding:0;
      font-family:Inter,Arial,sans-serif;
      background:#f7f9fc;
      color:#1b2432;
    }

    header{
      background:#0A3D91;
      color:white;
      padding:22px;
      text-align:center;
      font-size:22px;
      font-weight:900;
    }

    .container{
      max-width:1100px;
      margin:30px auto;
      background:white;
      padding:30px;
      border-radius:14px;
      box-shadow:0 4px 18px rgba(0,0,0,0.08);
    }

    h2{
      color:#0A3D91;
      border-left:4px solid #F2B840;
      padding-left:10px;
      font-weight:900;
    }

    h3{
      color:#0A3D91;
      font-weight:800;
      margin-top:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 340px;
      gap:25px;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:600;
    }

    input,textarea,select{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #dfe4ea;
      margin-top:6px;
      font-size:14px;
    }

    button{
      margin-top:16px;
      padding:12px 22px;
      background:#0A3D91;
      color:white;
      border:none;
      border-radius:8px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    button:hover{ background:#072b6b; }

    /* SECTION À DROITE */
    .card{
      background:#f8fbff;
      border:1px solid #e2e8f0;
      padding:18px;
      border-radius:12px;
      margin-bottom:18px;
    }

    .card strong{ color:#0A3D91; }

    /* WHATSAPP FLOAT */
    #wa-btn{
      position:fixed;
      right:18px;
      bottom:18px;
      width:60px;
      height:60px;
      background:#25D366;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      color:white;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,0.25);
      z-index:999;
    }

    @media(max-width:900px){
      .grid{ grid-template-columns:1fr; }
    }

  </style>

  <!-- Multilingue script -->
  <script>
    function setLang(l){
      document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = el.dataset[l];
      });
      localStorage.setItem("lang_contact",l);
    }
    window.onload = ()=>{
      const l = localStorage.getItem("lang_contact") || "fr";
      setLang(l);
    };
  </script>

</head>

<body>

<header data-fr="Contact & Partenariats" data-en="Contact & Partnerships"></header>

<div class="container">

  <!-- LANG SWITCH -->
  <div style="text-align:right;margin-bottom:10px;">
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
  </div>

  <h2 data-fr="Formulaire de contact" data-en="Contact Form"></h2>

  <div class="grid">

    <!-- FORMULAIRE -->
    <div>
      <form onsubmit="sendForm(event)">

        <label data-fr="Nom complet" data-en="Full name"></label>
        <input id="f-name" required>

        <label data-fr="Email professionnel" data-en="Professional email"></label>
        <input id="f-email" type="email" required>

        <label data-fr="Type de demande" data-en="Request type"></label>
        <select id="f-type" required>
          <option value="">—</option>
          <option data-fr="Partenariat entreprise" data-en="Business partnership">Partenariat entreprise</option>
          <option data-fr="Test pilote / POC" data-en="Pilot test / POC">Test pilote / POC</option>
          <option data-fr="Support client" data-en="Customer support">Support client</option>
          <option data-fr="Recrutement" data-en="Recruitment">Recrutement</option>
          <option data-fr="Autre demande" data-en="Other request">Autre demande</option>
        </select>

        <label data-fr="Message" data-en="Message"></label>
        <textarea id="f-msg" rows="5" required></textarea>

        <button type="submit" data-fr="Envoyer la demande" data-en="Send request"></button>
      </form>
    </div>

    <!-- INFOS & SUPPORT -->
    <aside>

      <div class="card">
        <h3 data-fr="Coordonnées officielles" data-en="Official Contacts"></h3>
        <p>📧 Email : <strong>info@cizagroup.com</strong></p>
        <p>📱 WhatsApp : <strong>+1 514 502 9503</strong></p>
        <p data-fr="Siège : Bujumbura, Burundi" data-en="Head office: Bujumbura, Burundi"></p>
      </div>

      <div class="card">
        <h3 data-fr="Entreprises & Partenariats" data-en="Business & Partnerships"></h3>
        <p data-fr="Solutions : flotte, livraison, immobilier, digital, logistique, paiements."
           data-en="Solutions: fleet, delivery, real estate, digital, logistics, payments."></p>
      </div>

      <div class="card">
        <h3 data-fr="Support client" data-en="Customer support"></h3>
        <p data-fr="Assistance pour CizaRide+, CizaPay+, Livraisons, Immobilier."
           data-en="Support for CizaRide+, CizaPay+, Delivery, Real Estate."></p>
      </div>

    </aside>
  </div>
</div>

<!-- WHATSAPP FLOAT -->
<div id="wa-btn" onclick="openWA()">💬</div>

<script>
  function openWA(){
    const url = "https://wa.me/15145029503?text=" +
      encodeURIComponent("Bonjour 👋 J’ai une question concernant les services CIZA GROUP.");
    window.open(url,"_blank");
  }

  function sendForm(e){
    e.preventDefault();

    const name = document.getElementById("f-name").value.trim();
    const email = document.getElementById("f-email").value.trim();
    const type = document.getElementById("f-type").value;
    const msg = document.getElementById("f-msg").value.trim();

    const message =
      "Nouvelle demande depuis le site CIZA GROUP :%0A" +
      "• Nom : " + name + "%0A" +
      "• Email : " + email + "%0A" +
      "• Type : " + type + "%0A" +
      "• Message : " + msg;

    const url = "https://wa.me/15145029503?text=" + message;

    window.open(url,"_blank");
    alert("Votre demande a été envoyée via WhatsApp ✔️");
  }
</script>

</body>
</html>
