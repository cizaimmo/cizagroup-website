<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact — CIZA GROUP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Inter, Arial, sans-serif;
      margin:0; padding:0;
      background:#f5f8ff;
      color:#0A3D91;
    }

    /* NAVBAR SIMPLE */
    header {
      background:#0A3D91;
      padding:18px;
      text-align:center;
    }
    header img {
      height:60px;
    }

    /* SECTION TITRE */
    .title-section {
      text-align:center;
      padding:40px 20px 10px;
    }
    .title-section h1 {
      font-size:32px;
      font-weight:900;
    }

    /* FORMULAIRE + INFOS */
    .contact-container {
      max-width:1100px;
      margin:20px auto;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 4px 16px rgba(0,0,0,0.08);
    }

    .contact-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
    }

    input, textarea {
      width:100%;
      padding:12px;
      border:1px solid #d5d5d5;
      border-radius:8px;
      margin-top:8px;
      font-size:15px;
    }

    button {
      background:#F2B840;
      padding:12px 25px;
      border:none;
      border-radius:6px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      margin-top:10px;
    }

    /* GOOGLE MAPS */
    .maps {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin-top:25px;
    }
    .maps iframe {
      width:100%;
      height:320px;
      border:0;
      border-radius:12px;
    }

    /* INSTAGRAM BLOCK */
    .instagram-block {
      margin-top:40px;
      text-align:center;
      padding:25px;
      background:white;
      border-radius:12px;
      box-shadow:0 3px 14px rgba(0,0,0,0.07);
    }
    .instagram-block a {
      text-decoration:none;
      background:#F2B840;
      color:black;
      padding:10px 20px;
      border-radius:50px;
      font-weight:700;
    }

    /* FOOTER */
    footer {
      margin-top:40px;
      background:#0A3D91;
      padding:25px;
      text-align:center;
      color:white;
    }

    /* WHATSAPP CHATBOT */
    #whatsapp-chat {
      position:fixed;
      bottom:20px; right:20px;
      z-index:999;
    }
    #whatsapp-chat img {
      width:60px;
      cursor:pointer;
    }

    /* RESPONSIVE */
    @media(max-width:900px) {
      .contact-grid, .maps {
        grid-template-columns:1fr;
      }
    }
  </style>

  <!-- LANGUAGE SYSTEM -->
  <script>
    function setLang(l) {
      document.querySelectorAll("[data-fr]").forEach(el => {
        el.innerHTML = el.dataset[l];
      });
      localStorage.setItem("lang_contact", l);
    }
    window.onload = () => {
      setLang(localStorage.getItem("lang_contact") || "fr");
    };
  </script>
</head>

<body>

<header>
  <img src="logo.png" alt="CIZA GROUP">
</header>

<div class="title-section">
  <h1 data-fr="Contactez-nous" data-en="Contact Us"></h1>
</div>

<div class="contact-container">

  <div class="lang" style="text-align:right; margin-bottom:10px;">
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
  </div>

  <div class="contact-grid">

    <!-- FORMULAIRE -->
    <div>
      <h2 data-fr="Envoyer un message" data-en="Send a message"></h2>
      <label data-fr="Nom" data-en="Name"></label>
      <input type="text" placeholder="Votre nom">

      <label data-fr="Email" data-en="Email"></label>
      <input type="email" placeholder="Votre email">

      <label data-fr="Téléphone" data-en="Phone"></label>
      <input type="text" placeholder="+1 ...">

      <label data-fr="Message" data-en="Message"></label>
      <textarea rows="5" placeholder="Votre message..."></textarea>

      <button data-fr="Envoyer" data-en="Send">Envoyer</button>
    </div>

    <!-- INFORMATIONS -->
    <div>
      <h2 data-fr="Nos coordonnées" data-en="Our Contacts"></h2>

      <p><strong>WhatsApp Canada :</strong> +1 514 502 9503</p>
      <p><strong>Email :</strong> info@cizagroup.com</p>

      <h3 data-fr="Canada" data-en="Canada"></h3>
      <p>Montréal, Québec</p>

      <h3 data-fr="Burundi" data-en="Burundi"></h3>
      <p>Bujumbura</p>
    </div>
  </div>

  <!-- GOOGLE MAPS -->
  <div class="maps">
    <iframe src="https://www.google.com/maps?q=Montreal&output=embed"></iframe>
    <iframe src="https://www.google.com/maps?q=Bujumbura&output=embed"></iframe>
  </div>

  <!-- INSTAGRAM -->
  <div class="instagram-block">
    <h2 data-fr="Suivez-nous sur Instagram" data-en="Follow us on Instagram"></h2>
    <a href="https://instagram.com" target="_blank">Instagram</a>
  </div>
</div>

<!-- FOOTER -->
<footer>
  © 2025 CIZA GROUP — Tous droits réservés
</footer>

<!-- WHATSAPP CHATBOT -->
<div id="whatsapp-chat">
  <a href="https://wa.me/15145029503?text=Bonjour%20CIZA%20GROUP%20!%20J%27aimerais%20plus%20d%27informations." target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
  </a>
</div>

</body>
</html>
