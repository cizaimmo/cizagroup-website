<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact — CIZA GROUP</title>
<link rel="icon" href="logotransparent.png">

<style>
/* GLOBAL */
body{
    margin:0;
    background:#06142e;
    color:white;
    font-family: Arial, sans-serif;
}
a{text-decoration:none;color:#F2B840;}

/* HEADER */
header{
    position:fixed;top:0;left:0;width:100%;
    background:#06142eDD;backdrop-filter:blur(6px);
    padding:15px 22px;z-index:999;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid #0e2a50;
}
header img{height:55px;}
.nav-links{display:flex;gap:22px;font-size:15px;}
.nav-links a{color:white;opacity:.8;}
.nav-links a:hover{opacity:1;color:#F2B840;}
.lang-switch span{
    margin-left:10px;cursor:pointer;opacity:.6;font-weight:bold;
}
.lang-switch .active{opacity:1;color:#F2B840;}

/* HERO */
.hero{
    padding:150px 20px 70px;
    text-align:center;
}
.hero h1{
    font-size:32px;
    color:#F2B840;
    margin-bottom:10px;
}
.hero p{opacity:.8;font-size:16px;}

/* WRAPPER */
.wrapper{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* FORMULAIRE CORPORATE */
.form-box{
    background:#0b1c34cc;
    padding:25px;
    border-radius:16px;
    border:1px solid #12335c;
    margin-bottom:40px;
}
.form-box h2{color:#F2B840;margin-top:0;text-align:center;}

input, select, textarea{
    width:100%;padding:14px;border-radius:10px;
    border:none;margin:8px 0;background:#112544;color:white;
}
textarea{height:140px;resize:none;}
button{
    width:100%;padding:14px;border:none;border-radius:10px;
    background:#F2B840;color:#06142e;font-size:16px;
    font-weight:bold;cursor:pointer;margin-top:14px;
}
button:hover{background:#c99933;}

/* PARTENAIRES */
.partner-section{
    background:#0b1c34dd;
    padding:30px;
    border-radius:18px;
    border:1px solid #1c3a65;
    margin-bottom:40px;
}
.partner-section h2{
    text-align:center;
    color:#F2B840;
    margin-top:0;
    margin-bottom:10px;
    font-size:26px;
}
.partner-section p{
    text-align:center;
    opacity:.85;
    margin-bottom:25px;
}
.partner-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}
.partner-card{
    background:#0f223d;
    padding:18px;
    border-radius:14px;
    border:1px solid #1d3b63;
    transition:.3s;
}
.partner-card:hover{
    transform:translateY(-4px);
    border-color:#F2B840;
}
.partner-card h3{
    color:#F2B840;
    margin-top:0;
    margin-bottom:10px;
}
.partner-card p{
    opacity:.85;
    font-size:14px;
}

/* INFO BOX */
.info-box{
    background:#0b1c34cc;
    padding:25px;border-radius:16px;
    border:1px solid #12335c;
}
.info-box h3{color:#F2B840;margin-top:0;}
.info-box p{opacity:.85;}
.info-box a{display:block;margin-top:6px;font-size:16px;}

/* FOOTER */
footer{
    margin-top:40px;padding:25px;text-align:center;
    background:#020a16;font-size:13px;opacity:.75;
}

/* MOBILE */
@media(max-width:600px){
    header img{height:45px;}
    .hero h1{font-size:26px;}
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <img src="logotransparent.png">

    <div class="nav-links">
        <a href="index.html" data-fr="Accueil" data-en="Home" data-ki="Ahabanza"></a>
        <a href="apropos.html" data-fr="À propos" data-en="About" data-ki="Abo turi bo"></a>
        <a href="business-diaspora.html" data-fr="Diaspora" data-en="Diaspora" data-ki="Abadiaspora"></a>
        <a href="services-burundi.html" data-fr="Services" data-en="Services" data-ki="Serivisi"></a>
    </div>

    <div class="lang-switch">
        <span onclick="setLang('fr')" id="lg-fr">FR</span>
        <span onclick="setLang('en')" id="lg-en">EN</span>
        <span onclick="setLang('ki')" id="lg-ki">KI</span>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <h1 data-fr="Contactez-nous" data-en="Contact Us" data-ki="Tuvugishe"></h1>
    <p data-fr="Nos équipes vous répondent rapidement"
       data-en="Our teams respond quickly"
       data-ki="Turishura vuba cane"></p>
</section>

<div class="wrapper">

    <!-- FORMULAIRE PREMIUM -->
    <div class="form-box">
        <h2 data-fr="Formulaire de contact"
            data-en="Contact Form"
            data-ki="Ifishi yo kutwandikira"></h2>

        <p style="opacity:.8;font-size:15px;margin-bottom:20px;"
           data-fr="Sélectionnez votre service pour que l’équipe concernée vous réponde rapidement."
           data-en="Select your service so the right team can assist you quickly."
           data-ki="Hitamwo serivisi kugira ko umugwi ubishinzwe ubishurire vuba."></p>

        <form action="https://formsubmit.co/infos@cizagroup.com" method="POST">

            <input type="text" name="name" placeholder="Nom complet / Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Téléphone / Phone Number">

            <select name="service" required>
                <option value="">Choisissez un service</option>
                <option>CizaRide+ — Mobilité</option>
                <option>CizaDelivery — Livraison</option>
                <option>CizaPay+ — Paiements</option>
                <option>CizaImmo — Immobilier</option>
                <option>CizaTech — Technologies</option>
                <option>CizaLogistics — Logistique</option>
                <option>CizaMarket — Marché & achats</option>
                <option>CizaAssist — Conciergerie</option>
                <option>CizaCarWash — Automobile</option>
                <option>CizaJobs — Emploi & Recrutement</option>
                <option>CizaAcademy — Formations</option>
            </select>

            <select name="type" required>
                <option value="">Type de demande</option>
                <option>Devenir partenaire</option>
                <option>Demande d’information</option>
                <option>Collaboration commerciale</option>
                <option>Investissement</option>
            </select>

            <textarea name="message" placeholder="Votre message..." required></textarea>

            <button type="submit"
                    data-fr="Envoyer la demande"
                    data-en="Send Request"
                    data-ki="Rungika"></button>
        </form>
    </div>

    <!-- SECTION PARTENAIRES PREMIUM -->
    <div class="partner-section">
        <h2 data-fr="Partenaires & Entreprises"
            data-en="Partners & Businesses"
            data-ki="Abarwizatunga & Amashirahamwe"></h2>

        <p data-fr="CIZA GROUP collabore avec les entreprises, investisseurs, PME, institutions publiques et partenaires techniques."
           data-en="CIZA GROUP works with companies, investors, SMEs, public institutions and technical partners."
           data-ki="CIZA GROUP ikorana n’amashirahamwe, abadandaza, abashoramari hamwe n’inzego za leta."></p>

        <div class="partner-grid">

            <div class="partner-card">
                <h3>Mobilité & Logistique</h3>
                <p data-fr="Partenariats pour CizaRide+, CizaDelivery et CizaLogistics : flottes, hôtels, commerces, entreprises de transport."
                   data-en="Partnerships for CizaRide+, CizaDelivery and CizaLogistics: fleets, hotels, shops, transport companies."
                   data-ki="Ubufatanye bwa CizaRide+, CizaDelivery na CizaLogistics: amahoteri, ubudandaji, n’ingendo."></p>
            </div>

            <div class="partner-card">
                <h3>Digital & Paiements</h3>
                <p data-fr="Solutions CizaPay+ et CizaTech pour entreprises souhaitant digitaliser paiements, sites, systèmes ou sécurité."
                   data-en="CizaPay+ and CizaTech solutions for companies seeking digital payments, websites, systems or security."
                   data-ki="Ibisubizo CizaPay+ na CizaTech ku mashirahamwe yipfuza iterambere mu ikoranabuhinga."></p>
            </div>

            <div class="partner-card">
                <h3>Immobilier & Services</h3>
                <p data-fr="Partenariats immobiliers et services : CizaImmo, CizaAssist, CizaCarWash pour propriétaires et entreprises."
                   data-en="Real estate and service partnerships: CizaImmo, CizaAssist, CizaCarWash for companies and property owners."
                   data-ki="Ubufatanye mu butunzi, serivisi n’ugutunganya imodoka."></p>
            </div>

        </div>

        <br><br>

        <button onclick="window.scrollTo({top:0,behavior:'smooth'})"
            style="width:100%;padding:14px;border:none;border-radius:10px;background:#F2B840;color:#06142e;font-size:16px;font-weight:bold;cursor:pointer;">
            Devenir partenaire officiel
        </button>
    </div>

    <!-- CONTACT DIRECT -->
    <div class="info-box">
        <h3 data-fr="Informations & Contact direct"
            data-en="Information & Direct Contact"
            data-ki="Amakuru & Uburyo bwo kutuvugisha"></h3>

        <p data-fr="Vous pouvez aussi nous joindre directement:"
           data-en="You can also reach us directly:"
           data-ki="Murashobora kuduhamagara canke kuduha ubutumwa:"></p>

        <a href="mailto:infos@cizagroup.com">📧 infos@cizagroup.com</a>
        <a href="https://wa.me/25779945007">🇧🇮 WhatsApp Burundi</a>
        <a href="https://wa.me/15145029503">🇨🇦 WhatsApp Canada</a>
        <br>
        <p>📍 Bujumbura, Burundi</p>
    </div>

</div>

<!-- FOOTER -->
<footer>
    © 2026 CIZA GROUP — Tous droits réservés.
</footer>

<script>
// MULTILINGUE
function setLang(l){
    document.querySelectorAll("[data-fr]").forEach(el=>{
        el.innerHTML = el.dataset[l];
    });
    document.querySelectorAll(".lang-switch span").forEach(el=>el.classList.remove("active"));
    document.getElementById("lg-"+l).classList.add("active");
}
setLang("fr");
</script>

</body>
</html>
