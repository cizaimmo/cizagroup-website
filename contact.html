<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Contact — CIZA GROUP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family: Inter, Arial, sans-serif;
  background:#f6f8fc;
  color:#1b2432;
}

/* HEADER */
header {
  background:white;
  padding:12px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:100;
}
header .brand { display:flex; align-items:center; gap:10px; }
header img { width:48px; height:48px; object-fit:contain; }
nav a {
  margin-left:15px;
  text-decoration:none;
  font-weight:600;
  color:#0A3D91;
}

/* HERO */
#hero-contact {
  background:#0A3D91;
  padding:70px 20px;
  text-align:center;
  color:white;
}
#hero-contact h1 {
  font-size:34px;
  font-weight:900;
}
#hero-contact p {
  font-size:17px;
}

/* CONTAINER */
.container {
  max-width:1100px;
  margin:40px auto;
  padding:20px;
}

/* CONTACT GRID */
.contact-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
  gap:25px;
}

/* BOX CONTACT */
.box {
  background:white;
  padding:25px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  box-shadow:0 4px 16px rgba(0,0,0,0.05);
}
.box h3 {
  color:#0A3D91;
  font-size:20px;
  font-weight:900;
  margin-bottom:10px;
}
.box p { font-size:14px; color:#4b5563; }

/* FORMULAIRE */
input, textarea {
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #d5d8e0;
  font-size:15px;
}
textarea { min-height:120px; }

button.send-btn {
  background:#F2B840;
  color:#0A3D91;
  border:none;
  padding:12px 26px;
  border-radius:50px;
  font-weight:800;
  margin-top:10px;
  cursor:pointer;
}

/* BUTTONS */
.btn {
  display:inline-block;
  padding:12px 20px;
  background:#F2B840;
  color:#0A3D91;
  font-weight:700;
  border-radius:50px;
  text-decoration:none;
  margin-top:12px;
}

/* FOOTER */
footer {
  background:#071336;
  color:white;
  padding:40px 20px;
  margin-top:50px;
}
footer a { color:#e5edff; text-decoration:none; }

</style>

<script>
function setLang(l){
  document.querySelectorAll("[data-fr]").forEach(el=>{
    el.innerHTML = el.dataset[l];
  });
  localStorage.setItem("lang_contact", l);
}
window.onload = () => {
  const l = localStorage.getItem("lang_contact") || "fr";
  setLang(l);
}
</script>

</head>
<body>

<!-- HEADER -->
<header>
  <div class="brand">
    <img src="logo.png">
    <strong style="color:#0A3D91;">CIZA GROUP</strong>
  </div>

  <nav>
    <a href="index.html">Accueil</a>
    <a href="services.html">Services</a>
    <a href="a-propos.html">À propos</a>
    <a href="business-diaspora.html">Diaspora</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section id="hero-contact">
  <h1 data-fr="Contactez-nous" data-en="Contact us"></h1>
  <p data-fr="Nous sommes disponibles pour répondre à vos besoins."
     data-en="We are available to answer your needs."></p>
</section>

<!-- CONTENT -->
<div class="container">

  <div class="contact-grid">

    <!-- FORMULAIRE -->
    <div class="box">
      <h3 data-fr="Formulaire de contact" data-en="Contact form"></h3>

      <form>
        <label data-fr="Nom complet" data-en="Full name"></label>
        <input type="text" placeholder="Votre nom">

        <label data-fr="Email" data-en="Email"></label>
        <input type="email" placeholder="Votre email">

        <label data-fr="Téléphone" data-en="Phone"></label>
        <input type="text" placeholder="+257 … / +1 …">

        <label data-fr="Message" data-en="Message"></label>
        <textarea placeholder="Votre message..."></textarea>

        <button class="send-btn" type="submit"
          data-fr="Envoyer"
          data-en="Send"></button>
      </form>
    </div>

    <!-- CONTACT DIRECT -->
    <div class="box">
      <h3 data-fr="Contact direct" data-en="Direct contact"></h3>
      <p>📞 Burundi : +257 799 45 007</p>
      <p>📞 Canada : +1 514 502 9503</p>
      <p>📧 Email : info@cizagroup.com</p>

      <a class="btn" href="https://wa.me/15145029503" target="_blank">
        WhatsApp Canada
      </a>

      <a class="btn" href="https://wa.me/25779945007" target="_blank">
        WhatsApp Burundi
      </a>

      <a class="btn" href="tel:+15145029503">📞 Appeler Canada</a>
      <a class="btn" href="tel:+25779945007">📞 Appeler Burundi</a>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer>
  <div style="max-width:1200px;margin:auto;">
    <div>© 2025 CIZA GROUP — Tous droits réservés</div>
    <div style="margin-top:10px;">
      <a href="legales.html">Mentions légales</a> •
      <a href="cgu.html">CGU</a>
    </div>
  </div>
</footer>

</body>
</html>
