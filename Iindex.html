<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CIZA GROUP — Écosystème de Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin:0; padding:0;
      font-family: Inter, Arial, sans-serif;
      background:#f7f9fc;
      color:#0A3D91;
    }

    /* NAVBAR */
    header {
      background:#0A3D91;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    header img {
      height:55px;
    }
    nav a {
      color:white;
      margin-left:18px;
      text-decoration:none;
      font-weight:600;
    }

    /* HERO */
    #hero {
      position:relative;
      height:82vh;
      background-image:url('hero-premium.png');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    #hero .overlay {
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.35);
    }
    #hero .content {
      z-index:2;
      text-align:center;
      color:white;
      max-width:800px;
    }
    #hero h1 {
      font-size:40px;
      font-weight:900;
      margin-bottom:15px;
    }
    .btn-gold {
      background:#F2B840;
      padding:12px 30px;
      border-radius:50px;
      color:black;
      text-decoration:none;
      font-weight:700;
      transition:0.3s;
    }
    .btn-gold:hover { background:#d9a432; }

    /* SERVICES */
    .services {
      text-align:center;
      padding:60px 20px;
    }
    .services h2 {
      font-size:30px;
      font-weight:900;
      margin-bottom:25px;
      color:#0A3D91;
    }
    .grid {
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:22px;
      max-width:1200px;
      margin:auto;
    }
    .card {
      background:white;
      padding:25px 15px;
      border-radius:10px;
      box-shadow:0 4px 14px rgba(0,0,0,0.06);
      font-weight:700;
    }

    /* MÉTÉO */
    .weather {
      max-width:1100px;
      margin:40px auto;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 3px 14px rgba(0,0,0,0.08);
    }
    .weather h2 {
      text-align:center;
      font-size:28px;
      font-weight:900;
    }
    .weather-box {
      display:flex;
      justify-content:space-around;
      margin-top:20px;
      text-align:center;
    }

    /* ACTUALITÉS */
    .news {
      max-width:1100px;
      margin:50px auto;
    }
    .news h2 {
      text-align:center;
      font-size:30px;
      font-weight:900;
    }
    .news-grid {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:20px;
      margin-top:25px;
    }
    .news-item {
      background:white;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 4px 16px rgba(0,0,0,0.08);
    }
    .news-item img {
      width:100%;
      height:170px;
      object-fit:cover;
    }
    .news-item p {
      padding:12px;
      font-weight:600;
    }

    /* FOOTER */
    footer {
      background:#0A3D91;
      padding:25px;
      text-align:center;
      color:white;
      margin-top:50px;
    }

    /* RESPONSIVE */
    @media(max-width:900px){
      .grid { grid-template-columns:repeat(2,1fr); }
      .news-grid { grid-template-columns:1fr; }
      #hero h1 { font-size:26px; }
    }
  </style>

  <!-- MULTILINGUE -->
  <script>
    function setLang(l) {
      document.querySelectorAll("[data-fr]").forEach(el => {
        el.innerHTML = el.dataset[l];
      });
      localStorage.setItem("lang_home", l);
    }
    window.onload = () => setLang(localStorage.getItem("lang_home") || "fr");
  </script>

</head>
<body>

<!-- NAVBAR -->
<header>
  <img src="logo.png" alt="CIZA GROUP">

  <nav>
    <a href="index.html" data-fr="Accueil" data-en="Home"></a>
    <a href="services.html" data-fr="Services" data-en="Services"></a>
    <a href="a-propos.html" data-fr="À propos" data-en="About"></a>
    <a href="contact.html" data-fr="Contact" data-en="Contact"></a>
  </nav>
</header>

<!-- HERO -->
<section id="hero">
  <div class="overlay"></div>
  <div class="content">
    <h1 data-fr="Écosystème de Service | Burundi" data-en="Service Ecosystem | Burundi"></h1>
    <a href="services.html" class="btn-gold" data-fr="Découvrir nos services" data-en="Explore Services"></a>
  </div>
</section>

<!-- SERVICES -->
<div class="services">
  <h2 data-fr="Nos Services" data-en="Our Services"></h2>

  <div class="grid">
    <div class="card">CizaRide+</div>
    <div class="card">CizaPay+</div>
    <div class="card">CizaImmo</div>
    <div class="card">CizaDelivery</div>
    <div class="card">CizaLogistics</div>
    <div class="card">CizaTech</div>
    <div class="card">CizaMarketing</div>
    <div class="card">CizaAcademy</div>
    <div class="card">CizaAssist</div>
    <div class="card">CizaCarWash+</div>
  </div>
</div>

<!-- MÉTÉO -->
<div class="weather">
  <h2 data-fr="Météo en direct" data-en="Live Weather"></h2>

  <div class="weather-box">
    <div>
      <h3>🇧🇮 Burundi</h3>
      <iframe src="https://forecast7.com/fr/--/bujumbura/" frameborder="0" width="250" height="180"></iframe>
    </div>

    <div>
      <h3>🇨🇦 Canada</h3>
      <iframe src="https://forecast7.com/en/45d50n73d56/montreal/" frameborder="0" width="250" height="180"></iframe>
    </div>
  </div>
</div>

<!-- ACTUALITÉS -->
<div class="news">
  <h2 data-fr="Actualités" data-en="News"></h2>

  <div class="news-grid">
    <div class="news-item">
      <img src="https://source.unsplash.com/600x400/?technology" alt="">
      <p>Technologie et Innovation</p>
    </div>

    <div class="news-item">
      <img src="https://source.unsplash.com/600x400/?business" alt="">
      <p>Entrepreneuriat au Burundi</p>
    </div>

    <div class="news-item">
      <img src="https://source.unsplash.com/600x400/?africa" alt="">
      <p>Développement en Afrique</p>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  © 2025 CIZA GROUP — Tous droits réservés
</footer>

</body>
</html>
